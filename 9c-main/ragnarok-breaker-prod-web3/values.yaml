externalSecretKey: ragnarok-breaker/prod-web3

imagePullSecret:
  secretKey: ragnarok-breaker/dockerhub

worker:
  image:
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071

v8Gateway:
  image:
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071

logStream:
  image:
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071

# Anti-cheat → Slack alert worker (prod only). SLACK_VIOLATION_WEBHOOK_URL is
# read from the ragnarok-breaker-env SecretsManager entry for this namespace.
anticheatAlertWorker:
  enabled: true
  image:
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071

# 메일 지급 워커 — prod web3 활성화. tag = petpop build:mail-send-worker 산출 이미지
#   (env-agnostic, SM 으로 env 주입 → staging 검증 이미지 재사용).
# 호스트명은 /mail-send 스킬의 mailSendWorkerUrlOf('prod','web3') 파생값과 1:1 일치해야 함.
# 발송 계정: MAIL_SENDER_V8_* 미설정 시 ragnarok-breaker/prod-web3 의 V8_ACCOUNT/_VERSE/_AUTH/_ENV
#   로 폴백. 해당 계정이 prod verse 에서 mailSendWorker role 로 등록돼 있어야 실제 발송 가능.
# 선택: Slack 알림은 AWS SM 에 MAIL_SEND_SLACK_WEBHOOK 추가 시 활성(미설정 시 skip).
mailSendWorker:
  enabled: true
  image:
    # SKIN_SHARD 를 메일 보상 키로 받아들이는 핫픽스가 들어간 sha 로 올린다. 이게 없으면
    # 폴크방 순위 보상이 /preview 에서 400 으로 거부된다 — 보상표가 전 티어에 조각을 준다.
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071
  httpRoute:
    enabled: true
    hostnames:
      - rb-mail-send-prod-web3.9c.gg

# 리그 보상 메일 워커 — prod 실지급. 같은 네임스페이스 mailSendWorker(위)를 내부 DNS 호출.
# ⚠ ArgoCD sync(=워커 기동) 전 필수:
#   (1) 이 verse Redis 의 SET `league-reward:paid` 에 이미 수동 지급된 리그 시즌 id 를 전부
#       SADD. 구 manual 도구(sendUserMailBatch)는 서버 receipt 를 안 남겨 결정론 jobId dedup 이
#       안 걸리므로, 미시딩 시 7일 lookback 안의 수동 지급 시즌을 재지급(이중지급)한다.
#   (2) AWS SM ragnarok-breaker/prod-web3 에 R2_PUBLIC_BASE·CDN_ENV 존재 확인.
#   발송계정(0x3c33)은 worker.records·user.read·mail.send 보유(확인됨).
leagueRewardWorker:
  enabled: true
  image:
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071
  config:
    verseLabel: prod-w3

# Fólkvangr 시즌 보상 자동 지급 워커 — prod web3 활성화.
# league-reward-worker 와 같은 Redis·시크릿을 쓰되 큐 prefix/상태 키가 갈려 있다.
#
# 추가로 필요한 SM 키는 없다 — 필수 env 중 VERSE_LABEL·MAIL_SEND_WORKER_URL 은 아래
# values 가 직접 주입하고, R2_PUBLIC_BASE·CDN_ENV·V8_*(또는 MAIL_SENDER_V8_*)·REDIS_URL
# 은 league-reward-worker 가 이미 쓰고 있어 ragnarok-breaker-env 에 존재한다.
# FOLKVANGR_REWARD_* 튜닝값은 전부 선택이며 미설정 시 코드 기본값으로 떨어진다
# (폴 1h / grace 1h / lookback 7d / confirm 지연 10m / preview stale 1h).
folkvangrRewardWorker:
  enabled: true
  image:
    tag: git-86b0027a3d69a14ee2945b057f6bc8261aa09071
  config:
    verseLabel: prod-w3

# anti-cheat 검증 워커 — 2026-11-11 비활성화(web3 종료). league-reward-worker 는 검증 미완료(pending)
# 시즌을 건너뛰므로 web3 리그 보상 자동 지급도 함께 멈춘다.
workers:
  stageValidation:
    enabled: false
  leagueValidation:
    enabled: false
