clusterName: 9c-main
provider: RKE2

externalSecret:
  enabled: true
  provider: AWS
  prefix: "9c-main-v2/external-services"

gateway:
  enabled: true
  services:
  - name: seasonpass-api-service
    hostname: seasonpass.9c.gg
  - name: iap-backoffice
    hostnames:
    - iap-backoffice.9c.gg
  - name: iap-api
    hostnames:
    - iap-api.9c.gg
  - name: ncboard
    hostnames:
    - ncboard.9c.gg
    - 9c-board.nine-chronicles.dev

volumeReclaimPolicy: "Retain"

seasonpass:
  enabled: true
  image:
    # SeasonPass #311 (invalid-claim -> count) — stacked on #310 -> #309 -> #308
    # -> #306, so this bump ships the whole stack on top of live bfbe0b2:
    #   485b172  raise DB pool 30 -> 60 (absorb connection holds)        [#306]
    #   887fe57  API: call cleared-stage RPC outside the DB transaction  [#308]
    #   52e16aa  tracker: run tx-tracker GQL outside the DB transaction  [#309]
    #   bfbe0b2  API: resolve level before mutating target in backfill   [#310]
    #   63c5735  API: /invalid-claim returns a count, not 503-if-any      [#311]
    # #306/#308/#309/#310 removed the lock convoy that exhausted the pool and
    # tripped the block-status/invalid-claim monitors. #311 stops a SINGLE
    # transient stuck claim (e.g. one heimdall tx that settled in ~13min) from
    # paging: /invalid-claim now returns the stuck-claim count (HTTP 200) instead
    # of 503-if-any, like IAP /purchase/invalid-receipt-count.
    #
    # !!! REQUIRED with this deploy: reconfigure the Assertible "Test Invalid
    # Claim" check to fail when the returned number exceeds a threshold (start
    # >=3). Until then the check always sees 200 and never alarms.
    #
    # No migration coupling: the partial index (#307) is already applied live and
    # the code works with or without it.
    tag: "git-63c57359136a7da0649ba1634d5ba4c01082f84d"

  api:
    enabled: true
    stage: "mainnet"
    nodeSelector:
      node.kubernetes.io/node-index: "2"
      node.kubernetes.io/provisioner: "cloudv"
      node.kubernetes.io/type: "general"

    # Bound memory so a runaway leak (e.g. NineChronicles.SeasonPass#303)
    # is OOMKilled+auto-restarted instead of degrading until manual fix.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    # /ping is a sync FastAPI route that runs in the same threadpool as
    # request handlers, so it queues when the threadpool is exhausted by
    # blocked GQL calls — exactly the hang signature we want to detect.
    livenessProbe:
      httpGet:
        path: /ping
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ping
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  worker:
    enabled: true
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-main-v2-seasonpass-worker"
    flower:
      enabled: true

    nodeSelector:
      node.kubernetes.io/node-index: "2"
      node.kubernetes.io/provisioner: "cloudv"
      node.kubernetes.io/type: "general"


  tracker:
    enabled: true

    nodeSelector:
      node.kubernetes.io/node-index: "2"
      node.kubernetes.io/provisioner: "cloudv"
      node.kubernetes.io/type: "general"

    odin:
      planetId: "0x000000000000"
    heimdall:
      planetId: "0x000000000001"
    thor:
      planetId: "0x000000000003"

    resources:
      limits:
        cpu: 0.25
        memory: 1Gi

backoffice:
  enabled: true

  image:
    pullPolicy: Always
    # NineChronicles.Backoffice#80 (PLD-1351) 머지본 — 복권 바우처 설정 허브
    #   (/voucher-config UI + REST /api/voucher/*) + 공지생성기 S3 업로드.
    #   인터널 복권 정책·매핑을 이 화면/API 로 설정하려면 이 이미지가 필요하다.
    #   백오피스는 prod 1벌만 배포하고 대상 환경은 호출마다 IapEnvironment 로 고른다 —
    #   그래서 "인터널 복권"을 위해 prod 백오피스를 올리는 구조다.
    #
    # ⚠️ 배포 전 필수 — SecretsManager(us-east-2)
    #     9c-main-v2/external-services/ninechronicles-backoffice-env 에 두 키 추가:
    #       NC_INTERNAL_PORTAL_ADMIN_JWT_KEY = 인터널 포탈(9c-internal-v2/portal/env)의
    #                                          JWT_VOUCHER_ADMIN_SECRET 과 동일 값
    #       NC_MAINNET_PORTAL_ADMIN_JWT_KEY  = prod 포탈에는 아직 JWT_VOUCHER_ADMIN_SECRET 이
    #                                          없다. 부팅 요건이라 값은 채우되, 메인넷 정책 저장은
    #                                          포탈이 배포되기 전까지 동작하지 않는다.
    #   두 키 없이 올리면 부팅 실패(ArgumentNullException) — 지금 도는 백오피스가 죽는다.
    #   → 이 요건은 이미 충족됐다(라이브 pod env 에 두 키 존재). 이번 bump 에 추가 조치 없음.
    #
    # (2026-08-26) NineChronicles.Backoffice#81 + #82 머지본으로 bump.
    #   #82 는 main 이 아니라 #81 브랜치로 머지돼 있었어서, #81 하나가 둘을 함께 실어 온다.
    #
    #   #81 정책에 platformMultiplier(PC/MOBILE) 추가 — 개봉 상금에 곱하는 플랫폼 배수.
    #     핵심은 **미지키 보존**이다. 지금 도는 이미지의 VoucherPolicyDto 엔 이 필드도
    #     [JsonExtensionData] 도 없어서, 정책 맵이 통째 교체되는 구조상 배수를 넣어둔 뒤
    #     백오피스로 정책을 한 번만 저장하면 그 키가 조용히 사라진다("PC 우대 ×1.25" 공지를
    #     띄운 채 실제 지급은 1.0). 값 검증(≤0·비유한·>100, 배수 적용 최대상금의
    #     Decimal(12,2) 초과·소수 3자리 → 400)도 이 이미지에만 있고, 포탈은 배수를 읽는
    #     코드가 배포되기 전엔 어떤 값이든 그냥 저장하므로 여기서 안 막으면 막는 곳이 없다.
    #   #82 매핑 신규 추가·삭제 UI(상품 전량 페이징 + 삭제 2단계 확인 + PROD 게이트).
    #     이 전 이미지엔 화면에 신규 추가가 없어 REST PUT /api/voucher/grants 로만 가능했다.
    #
    #   신규 env 없음 — 배포본(dd3d61e0)→main 사이에 새로 읽는 설정 키가 0 개다(#80 과 달리
    #     부팅 요건 추가가 없다). 코드가 읽는데 차트에 없는 NC_ 키 7 개(*_ARENA_URL 6, THOR_ENABLED)는
    #     **기존부터 동일**하고 `??` 기본값·불리언 비교라 부팅에 영향 없다.
    #
    #   ⚠️ 순서 제약 — 배수 **값**을 정책에 넣는 건 포탈이 그 키를 읽는 코드(9c-portal#1282)를
    #     배포한 뒤에. 이 이미지는 배수를 저장·검증·보존만 하고, 지급에 반영하는 건 포탈이다.
    #     지금 인터널 라이브 정책엔 platformMultiplier 키가 아예 없고(prizeTables/temporary 뿐),
    #     메인넷은 IAP 에 API_PORTAL_PRIZE_TABLES_URL 이 미설정이라 복권 체인 자체가 미배선이다.
    #     (엄밀히는 IAP env 가 가장 나중 관문이다 — prod 포탈에 /api/voucher/* 코드 자체가 없고
    #      JWT_VOUCHER_ADMIN_SECRET 도 없다. "IAP env 만 채우면 열린다"가 아니다.)
    #
    #   ⚠️ 이 이미지를 올려도 /voucher-config 화면은 **아직 열리지 않는다.** 화면의 Load() 가
    #     포탈 정책 GET 을 먼저 하고 실패하면 _loaded=false 로 남아 본문 전체(=#82 의 매핑
    #     신규추가·삭제 UI 까지)가 렌더되지 않는데, 인터널 포탈이 지금 /api/admin/voucher-policy
    #     404 다(test-monorepo 태그가 mutable 이라 NCU 검증용 재핀이 admin 라우트를 떨어뜨렸다.
    #     /api/voucher/prize-tables 는 200 이라 IAP 의 C1 검증엔 문제 없다). 메인넷도 404.
    #     → 화면을 쓰려면 인터널 포탈 test-monorepo 를 admin 라우트 포함 빌드로 재핀해야 한다.
    #     그때까지 매핑 세팅은 REST(PUT /api/voucher/grants) 또는 IAP admin 직접 경로로.
    #     이 bump 자체는 그래서 오늘 시점엔 무해하다(사실상 no-op + 아래 로그 유출 제거).
    #
    #   보너스: 지금 도는 이미지는 IAPRepository.GetProducts 가 IAP admin bearer(1 시간 유효,
    #     상품 import·매핑 upsert 권한)를 pod 로그에 찍고 있었다. 이 bump 로 없어진다.
    #
    #   후속: 배수 입력줄에 C# 코드가 리터럴로 렌더되는 버그(Backoffice#83, foreach…else)가
    #     이 태그에 남아 있다. 위 404 때문에 화면이 안 열려 지금은 보이지 않고, #83 머지 후
    #     새 태그로 한 번 더 bump 한다.
    #
    # (2026-08-28) NineChronicles.Backoffice#84 머지본으로 bump — Lib9c 패키지만 올린다
    #   (1.36.0-dev.d0a645ab → 1.37.0-dev.0f3fd4bf6e). 코드 변경 없음.
    #
    #   왜: 시트 비교/검증 화면이 CsvValidationService.FindTableType 에서
    #     typeof(WorldSheet).Assembly 를 리플렉션으로 훑어 시트 타입을 찾는데, 1.36.0-dev 에는
    #     신규 RestrictionSheet 타입이 없어 "테이블 타입을 찾을 수 없습니다" 로 떨어졌다.
    #     별도 시트 목록이 있는 게 아니라 패키지 버전이 인식 범위를 그대로 정한다.
    #
    #   0f3fd4bf6e 는 lib9c release/1.37.0 의 HEAD 이고, 헤드리스 395(인터널 배포됨)와
    #     클라 prepare/480.0.x 가 쓰는 것과 같은 커밋이다.
    #
    #   1.37.0 의 breaking 변경(RegisterProduct.Register 필수 파라미터 추가,
    #     SynthesizeWeightSheet.DefaultWeight 10000→0, GetWeight)을 쓰는 코드는 백오피스에
    #     없다 — 두 프로젝트 빌드 오류 0 으로 확인. 백오피스는 시트를 비교·검증만 하고
    #     합성 판정을 하지 않으므로 기본 weight 전환의 동작 영향도 없다.
    tag: "git-5240157779a2c496edcac1c7c3cdaab6a7daf01d"


iap:
  enabled: true
  backoffice:
    enabled: false
    image:
      # enabled: false 라 렌더되지 않는다. 스테일 핀만 정리(동작 영향 없음).
      tag: "git-09c4d575a3e9a93f0e1b9b8d5a49e812ef8a863f"

  api:
    enabled: true
    stage: "mainnet"
    image:
      # IAP main 최신(09c4d57). 라이브는 아직 git-4cca284 라 이 배포가 두 핫픽스를 함께 올린다.
      #   #481 배송 가드 — /purchase/request 의 멱등 조기반환이 상태를 보지 않고 200 + 기존
      #     영수증을 돌려줬다. 클라는 non-null 응답이면 confirm(= consume + Google acknowledge)
      #     하고, acknowledge 는 스토어 자동환불을 취소시킨다. 미지급 결제가 "배송도 환불도 없는"
      #     상태로 굳을 수 있었다. 이제 tx_status 가 있으면 200, INVALID 면 거절, 그 외 200.
      #   #482 중복 영수증 레이스 — (store, order_id) 에 unique 가 없어 중복검사(SELECT→INSERT)에
      #     경쟁이 나면 둘 다 통과해 이중 지급됐다. 메인넷 실측 66그룹 / 이중지급 34건(33건이
      #     1초 이내). pg_advisory_xact_lock 으로 그 구간을 직렬화한다. 인터널 검증 완료.
      #   (누적) #480 월별 구매 조회 status 필터, #477 retry 500 핫픽스 포함.
      # 마이그레이션 커플링 없음 — (store, order_id) 인덱스는 2026-08-25 에 이미 적용했다
      #   (CREATE INDEX CONCURRENTLY, 6.9초, 47MB). 코드는 인덱스 유무와 무관하게 동작한다.
      tag: "git-09c4d575a3e9a93f0e1b9b8d5a49e812ef8a863f"
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-main-v2-iap-worker"

    nodeSelector:
      node.kubernetes.io/node-index: "2"
      node.kubernetes.io/provisioner: "cloudv"
      node.kubernetes.io/type: "general"

  worker:
    enabled: true
    stage: "mainnet"
    image:
      # api 와 같은 커밋으로 정렬. 라이브 git-9321af4(2026-07-01)에서 약 2개월치를 올린다.
      #   추가되는 건 전부 additive 다(worker/shared 경로 +1,334줄, 삭제 0):
      #     - 바우처(복권) 발급/회수 beat 태스크 2종, purchase_signal 모델.
      #   ⚠️ 바우처 태스크는 config.voucher_grant_enabled(기본 false)를 첫 줄에서 검사해
      #     DB 세션도 열지 않고 즉시 반환한다. 메인넷엔 WORKER_VOUCHER_* env 가 없으므로
      #     스케줄에만 올라가고 실제로는 아무 일도 하지 않는다(휴면). track_google_refund 의
      #     회수 훅도 같은 플래그로 막힌다.
      #   마이그레이션 커플링 없음 — 메인넷 alembic head 는 이미 0eb7c95c9f30(purchase_signal +
      #     voucher 체인 merge)라 DB 가 오히려 코드보다 앞서 있었다. 이 bump 가 둘을 맞춘다.
      tag: "git-09c4d575a3e9a93f0e1b9b8d5a49e812ef8a863f"
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-main-v2-iap-worker"

    nodeSelector:
      node.kubernetes.io/node-index: "2"
      node.kubernetes.io/provisioner: "cloudv"
      node.kubernetes.io/type: "general"

ncboard:
  enabled: true
  image:
    tag: git-d876a80f84f1a6bdf01ef470282e710467954479
