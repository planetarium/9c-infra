apiVersion: batch/v1
kind: CronJob
metadata:
  name: arena-staking-collector
  namespace: batch-jobs
  labels:
    app.kubernetes.io/instance: batch-jobs
spec:
  # 매시 정각 — 시즌이 끝나고 1시간 안에 정산용 스테이킹 파일(garage staking-for-arena/main/<Planet>/<id>.json)이 생기게.
  # 하루 한 번(00:00 UTC)이면 09:00 KST 이후 끝난 시즌은 다음 날까지 백오피스 아레나 정산이 "스테이킹 정보 파일 없음"으로 실패한다(2026-10-21).
  # 이미 올라간 시즌이면 R2 존재 확인 뒤 바로 종료하므로 부담 없음. 스테이킹은 시즌 종료 블록 기준이라 수집 시각과 무관하다.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: python-script
            image: python:3.11-slim
            command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir -r /app/requirements.txt
              echo "Starting arena staking data collection for main Heimdall..."
              python /app/script.py main Heimdall
              echo "Starting arena staking data collection for main Odin..."
              python /app/script.py main Odin
            env:
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: R2_ENDPOINT
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: R2_ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: R2_SECRET_ACCESS_KEY
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: R2_BUCKET_NAME
            volumeMounts:
            - name: script-volume
              mountPath: /app
          volumes:
          - name: script-volume
            configMap:
              name: arena-staking-collector-config
          restartPolicy: OnFailure 