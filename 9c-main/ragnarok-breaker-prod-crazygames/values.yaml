# Ragnarok Breaker CrazyGames 호환 게임서버 — 메인넷(9c-main) prod.
# 차트: charts/ragnarok-breaker-compat (단일 인스턴스, replicas 1 고정)

# GUEST_TOKEN_SECRET 등 비밀 환경변수 → secret compat-server-env
externalSecretKey: ragnarok-breaker/prod-crazygames

imagePullSecret:
  secretKey: ragnarok-breaker/dockerhub

image:
  # ragnarok-breaker(yang fork) spike/crazygames-build b20bd7e3 — 워커용 관리자 RPC 포트·안티치트 이벤트 전달
  tag: git-b20bd7e3e43c5b0aba77d725405d6be129ef6f18

env:
  APP_ENV: prod-w2
  SEED_CHANNEL: prod
  STATE_DB: /data/state.db
  STATE_BACKUP_DIR: /data/backups
  NODE_ENV: production
  # CORS 허용 출처(호스트 접미사). 포털 밖 임베드 도메인이 생기면 여기에 추가.
  ALLOWED_ORIGINS: crazygames.com
  # CrazyGames 개발자 포털의 이 게임 gameId — 숫자 ID 이며 미리보기 URL 의 UUID 가 아니다.
  # 비어 있으면 로그인 토큰을 전부 거부한다(게스트만 플레이).
  CG_GAME_ID: "163340"

httpRoute:
  hostnames:
    - rb-crazygames.9c.gg

# 백그라운드 워커(검증 2·안티치트 알림·메일·리그 지급·폴크방 지급) — compat-server 관리자 포트로 붙는다.
# ⚠ sync 전 AWS SM ragnarok-breaker/prod-crazygames 에 필요:
#   ADMIN_RPC_TOKEN(필수, 32자 이상 무작위 — 없으면 서버가 관리자 포트를 안 열어 워커가 못 붙는다),
#   COMPAT_OPERATOR_TOKEN(필수, 32자 이상 무작위, ADMIN_RPC_TOKEN 과 다른 값 — 메일 워커 /preview·/confirm 용),
#   슬랙(선택, V8 prod-web2 와 같은 값): SLACK_VIOLATION_WEBHOOK_URL,
#   MAIL_SEND_SLACK_BOT_TOKEN, MAIL_SEND_SLACK_CHANNEL, MAIL_SEND_SLACK_WEBHOOK.
# 서버 이미지와 워커 이미지는 같은 커밋에서 빌드한다(image.tag == workers.tag).
# ⚠ 순서: SM 갱신 → k8s secret 반영 확인 → sync. 서버는 기동할 때만 ADMIN_RPC_TOKEN 을 읽고 비밀값
#   변경엔 재시작하지 않는다. 키가 없는 채 뜨면 관리자 포트가 안 열려 워커가 못 붙고, 서버를 한 번 더
#   재시작해야 한다. ExternalSecret 반영은 최대 1분 늦으니 sync 전에 확인:
#     kubectl -n ragnarok-breaker-prod-crazygames get secret compat-server-env -o json \
#       | jq '.data | keys'   # ADMIN_RPC_TOKEN·COMPAT_OPERATOR_TOKEN 이 있어야 함
# ⚠ ADMIN_RPC_TOKEN 이 32자 미만이면 서버 전체가 기동에 실패한다(게임 중단).
adminRpc:
  enabled: true

redis:
  enabled: true

workers:
  enabled: true
  tag: git-b20bd7e3e43c5b0aba77d725405d6be129ef6f18
