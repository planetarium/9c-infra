validator:
  count: 1

  env:
  - name: Headless__AccessControlService__AccessControlServiceType
    value: "local"
  - name: Headless__AccessControlService__AccessControlServiceConnectionString
    value: "https://9c-cluster-config.s3.us-east-2.amazonaws.com/9c-main/odin/whitelist.json"
  - name: PLUGIN_PATH
    value: "/data"
  - name: DOTNET_gcServer
    value: "1"

  loggingEnabled: true
  datadog:
    enabled: false

  extraArgs:
  - --tx-quota-per-signer=1
  - --tx-life-time=10
  - --consensus-target-block-interval=7650
  - --maximum-transaction-per-block=150
  - --consensus-enter-precommit-delay=300

  consensusSeedStrings:
  - "027bd36895d68681290e570692ad3736750ceaab37be402442ffb203967f98f7b6,odin-tcp-seed-1.nine-chronicles.com,31235"

  hosts:
  - "odin-node-validator-5.nine-chronicles.com"

  loadBalancerIPs:
  - "115.68.194.100"

  nodeSelector:
  - node.kubernetes.io/network: odin
    node.kubernetes.io/node-index: '3'

  storePath: "/data/headless"

  # 2026-09-26 포크 복구 때 validator 를 data-4 로 스왑했다(data-1 은 포크 스토어라 삭제).
  # 2026-09-28 rh-1 이 data-1 을 스냅샷 리셋으로 새로 채웠고(214G), data-4 는 85%(543G) 까지 찼다.
  # 그래서 validator 는 새 data-1 로, rh-1 은 data-4 로 맞바꾼다. 두 볼륨의 replica 가 모두 odin-3 에
  # 있어서 validator 는 로컬 replica 를 쓰게 된다.
  # ⚠️ RWO 라 두 STS 를 모두 0 으로 내리고 볼륨이 detached 된 뒤에 sync 할 것(안 그러면 multi-attach).
  # 상세: memory/troubleshooting_odin_chain_fork_recovery.md
  storage:
    volumeNames:
    - "remote-headless-data-1-remote-headless-1-0"

  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: validator-test

  resources:
    requests:
      cpu: "3"
      memory: 25Gi
    limits:
      memory: 30Gi

remoteHeadless:
  count: 1
  replicas: 1

  scheduledRestart:
    enabled: true
    schedule: "0 22 * * *"

  useTurnServer: false

  hosts:
  - "odin-node-1.nine-chronicles.com"

  loadBalancerIPs:
  - 115.68.194.60

  nodeSelector:
  - node.kubernetes.io/network: odin
    node.kubernetes.io/node-index: '1'

  env:
  - name: Headless__AccessControlService__AccessControlServiceType
    value: "local"
  - name: Headless__AccessControlService__AccessControlServiceConnectionString
    value: "https://9c-cluster-config.s3.us-east-2.amazonaws.com/9c-main/odin/whitelist.json"
  - name: PLUGIN_PATH
    value: "/data"
  - name: DOTNET_gcServer
    value: "1"
  - name: JWT__Key
    valueFrom:
      secretKeyRef:
        key: jwt
        name: private-keys
  - name: RPC_KEEPALIVE_PING_DELAY_SECONDS
    value: "30"

  extraArgs:
  - --tx-quota-per-signer=1

  resources:
    requests:
      cpu: "5"
      memory: 25Gi
    limits:
      memory: 30Gi

  # data-1 은 validator 가 쓴다(위 validator 블록 주석 참고). 2026-09-29 rh-1 의 data-4 는 지우고
  # 같은 이름으로 data-1 의 Longhorn clone(PVC dataSource)을 새로 만들었다(clone 후 txexec 삭제).
  # 그래서 이 PVC 는 차트 렌더와 달라 ArgoCD 에서 cosmetic OutOfSync 로 보인다 — prune 금지.
  # 예전엔 클론 대신 스냅샷 리셋을 썼다: 543G 짜리 data-4 를 클론하면 odin-1 에 73G 밖에 안 남았다.
  # data-1 은 214G 라 클론해도 여유가 있다.
  storage:
    volumeNames:
    - "remote-headless-data-4-remote-headless-4-0"

  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: remote-headless-test

  loggingEnabled: true
  datadog:
    enabled: false

