apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maple-go-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/planetarium/9c-infra.git
    targetRevision: main
    path: charts/maple-go
    helm:
      valueFiles:
        - /9c-main/maple-go/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: maple-go-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
