portalService:
  name: portal
  hostnames:
    - "nine-chronicles.com"
    - "www.nine-chronicles.com"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  nodeSelector:
    node.kubernetes.io/type: baremetal
  image:
    repository: planetariumhq/9c-portal
    # 포탈 main 최신(4f2efd5a). 7dff2fe4..4f2efd5a 에서 apps/portal 변경은
    #   **NCU 펫팝 계정 연동(#1317) 하나뿐**이다(#1316 은 apps/backoffice 한 파일이라
    #   포탈 이미지와 무관 — backofficeService 태그는 #3630 에서 이미 같은 sha 로 올라갔다).
    #   신규 엔드포인트 POST /api/ncu/petpop-link-token + /ncu PETPOP 행의
    #   "Open PETPOP"(단순 외부링크) → "Connect PETPOP"(원타임 링크토큰 발급 후
    #   펫팝 /api/user/connect?app=portal 리다이렉트).
    # 왜 필요했나: 수신부(펫팝)는 2026-09-04 에 이미 prod 에 나갔는데 포탈만 인터널에
    #   머물러 있었다. 그래서 유저가 NCU 페이지에서 연동을 눌러도 아무 일도 일어나지
    #   않았고(문의 #15156), 펫팝 퀘스트의 "9c 연동"은 포탈로 되돌려보내 순환이었다.
    # ⚠️ 크로스레포 계약이라 아래 prod env 가 맞아야만 동작한다(배포 전 실측 확인함):
    #      포탈 PETPOP_API_ENDPOINT=https://petpop.fun / BASE_URL=https://nine-chronicles.com
    #      펫팝 NINE_C_JWT_ISS=9C / NINE_C_JWT_AUD=PetPoP / 공유시크릿 지문 양쪽 일치
    #   토큰 exp 는 iat+300 고정 — 펫팝 validatePortalLinkClaims 의 `exp - iat > 300`
    #   경계라 포탈 단독으로 못 늘린다(늘리려면 펫팝 PORTAL_LINK_WINDOW_SEC 부터).
    # 참고: 펫팝 PORTAL_RETURN_ORIGINS 가 빈 값이라 연동 후 포탈 복귀 없이 펫팝 /game
    #   착지다(연동 자체는 성공 — 9/4 설계에서 택한 동작).
    # DB 마이그레이션 커플링 없음 — 7dff2fe4..4f2efd5a 에 packages/database 변경이 없다.
    # (2026-10-02) → main-11e20597: 포탈 포인트 개편 #1320/#1321 — 포인트 종류(PP-S/PP-X) 잔고·
    #   포인트샵(IAP 카탈로그 catalog=point)·뽑기·애니버서리 미션 4종(기본 비활성)·DB 부하 개선.
    #   ⚠️ DB 커플링 있음 — prod 마이그레이션 2026-10-01 적용 완료(README "prod 적용 순서",
    #   reward.kind·reward_config.kind·shop_order·RewardSource SHOP_SPEND). 되돌릴 땐 이미지만 —
    #   DB 변경이 additive 라 구 이미지(4f2efd5a)도 그대로 돈다.
    tag: main-11e20597ba0ccb22503efa9e04d678475c9c871c
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-main-v2/portal"
  env:
    NODE_ENV: production
    BASE_URL: "https://nine-chronicles.com"
    NEXT_PUBLIC_STATUS_SERVER_URL: "https://portal-status.nine-chronicles.com"
    S3_BANNER_BUCKET: "9c-portal-banner"
    BANNER_CLOUD_FRONT_DOMAIN: "https://d20llolvuaz1gj.cloudfront.net/"
    QA_ENABLED: false
    NEXT_PUBLIC_MAINNET_ENV: production
    NEXT_PUBLIC_PLANETARY_ENDPOINT: "https://planets.nine-chronicles.com/planets/"
  # (PLD-1563) 포인트샵 주문 ↔ IAP 지급 대조. 이게 없으면 GRANT_REQUESTED 주문이 확정되지 않고,
  #   IAP FAILED 의 포인트 환급·타임아웃 주문 정리가 영영 안 된다. 이 목록이 있어야 차트가 포탈
  #   파드에 SCHEDULER_API_KEY(백오피스 시크릿 재사용)를 주입한다 — 없으면 엔드포인트가 503.
  #   ⚠️ IAP 상품을 point_shop_grantable 로 켜기 **전에** 떠 있어야 한다. 그 전엔 대조할 주문이
  #   없어 매 회차 0건이다(무해). 인터널과 같은 설정.
  cronjobs:
    - name: shop-grant-reconcile
      schedule: "*/5 * * * *"
      endpoint: "https://nine-chronicles.com/api/scheduler/shop-grant-reconcile"
      tokenEnvName: "SCHEDULER_API_KEY"
      timeoutSeconds: 240
backofficeService:
  name: backoffice
  hostname: "portal.planetarium.team"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  nodeSelector:
    node.kubernetes.io/type: baremetal
  image:
    repository: planetariumhq/9c-portal-backoffice
    # 백오피스 main 최신(4f2efd5a, #1318). 7dff2fe4..4f2efd5a 에서 백오피스 코드 변경은
    #   **출금 스케줄러 advisory 락 수정(#1316) 하나뿐**이다:
    #     pg_try_advisory_lock → pg_try_advisory_xact_lock
    #   세션 단위 락이 ROLLBACK 으로 안 풀려 Prisma 풀 커넥션에 남는 누수였다. 2026-09-21
    #   메인넷 출금 7일 정지(959건 / 132,275 NCG)의 근본 원인이고, 인프라 쪽 응급 수정
    #   (#3621 curl --max-time)만으로는 "영구 정지"가 "처리량 40%"로 바뀔 뿐이었다.
    # ⚠️ 포탈 태그(L23)는 7dff2fe4 유지 — 이번 백오피스 변경은 apps/backoffice 한 파일이고
    #   apps/portal 쪽 변경(#1317 NCU 펫팝)은 별개다. 굳이 같이 bump 하면 프로브 없는
    #   prod 포탈 pod 만 불필요하게 재기동되므로 백오피스만 올린다.
    # DB 마이그레이션 커플링 없음 — packages/database 변경 없음.
    # (2026-10-02) → main-11e20597: 포탈과 같은 커밋. 새 Prisma 클라이언트가 reward.kind·
    #   reward_config.kind 를 읽는다(마이그레이션 선행 완료). rewardConfig 에 지급 종류(NCG/PP_S)
    #   선택 추가, Reward Candidate Apply 가 밴 계정을 건너뛴다(skippedTargets).
    tag: main-11e20597ba0ccb22503efa9e04d678475c9c871c
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-main-v2/backoffice"
  cronjobs:
    - name: withdrawal
      schedule: "*/2 * * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/withdrawal"
      tokenEnvName: "SCHEDULER_API_KEY"
    - name: withdrawal-status
      schedule: "*/15 * * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/transaction"
      tokenEnvName: "SCHEDULER_API_KEY"
      # 평시 7~9초지만 핸들러가 미확정 tx 를 14일 창으로 훑고 **행마다 GraphQL 을 2번** 친다
      # (take 상한 없음). 백로그 드레인 구간엔 후보가 수백 행까지 차올라 기본 100초를 넘긴다.
      # ADS 는 615초로 15분 주기보다 훨씬 짧아 인바리언트(ADS < 주기)는 유지된다.
      timeoutSeconds: 600
    # 글로리 리딤 날짜별 통계 → Slack #9c-metrics (read-only 집계, 돈 액션 없음). 매일 10:00 KST(01:00 UTC).
    # ⚠️ 엔드포인트(9c-portal PR #1264)가 prod backoffice에 배포된 뒤 유효. 그 전엔 404(무해).
    - name: redeem-stats
      schedule: "0 1 * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/redeem-stats"
      tokenEnvName: "SCHEDULER_API_KEY"
      # 일 1회라 다음 tick 이 24시간 뒤다 — 일시적 실패 한 번이 하루치 리포트 결손이 된다.
      # (이미지가 :latest 라 pull 이 Always 이고, 이 클러스터는 DockerHub 간헐 실패 이력이 있다.)
      # 재시도가 ADS 안에 들어가도록 timeout 도 함께 올린다. 315초 ≪ 24시간.
      backoffLimit: 2
      timeoutSeconds: 300

# 지급 지갑 잔고 일일 리포트 → Slack #9c-metrics, 매일 10:00 KST(01:00 UTC).
# 주소는 portalService.env(NC_ADDRESS_PORTAL / NC_ADDRESS_NCG_VOUCHER)와 백오피스 KMS_MEAD_ADDRESS 기준.
# 셋 다 Odin 체인 계정이며, 크로스플래닛 출금도 Odin 지갑에서 나가므로 Odin만 조회한다.
walletBalanceReport:
  enabled: true
  schedule: "0 1 * * *"
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  # odin-rpc-1 을 쓰지 말 것 — nginx 경유 remote-headless-1 단일 매핑(StreamingHub sticky)
  # 이라 rh-1 이 내려가면 백업 upstream 없이 502 가 된다. 2026-09-26 실제로 이 리포트가
  # "조회 실패" 로 나갔다. odin-gql 은 upstream 이 [rh-1, validator-5] 라 한쪽이 죽어도
  # 살아남고, 복구되면 자동으로 다시 분산된다.
  gqlEndpoint: "https://odin-gql.nine-chronicles.com/graphql"
  wallets:
    - label: "출금/리워드"
      address: "0x491d9842ed8f1b5d291272cf9e7b66a7b7c90cda"
      assets: ["NCG", "MEAD"]
    - label: "NCG 바우처"
      address: "0xc1Ea0D238f7b1C9c70Ce6589DAb2F15C1A076455"
      assets: ["NCG", "MEAD"]
    - label: "MEAD 지급"
      address: "0xc64c7cBf29BF062acC26024D5b9D1648E8f8D2e1"
      assets: ["MEAD"]

# 출금 적체 감시 (차트 values 의 주석에 배경). 잔고 리포트와 같은 채널·같은 봇 토큰을 쓴다.
withdrawalBacklogAlert:
  # ⚠️ 2026-09-21 적체(959건)를 드레인하는 동안은 켜지 않는다 — 이미 알고 있고 이미
  #    대응 중인 건으로 시간당 1건씩 #9c-metrics 를 때리게 된다. 채널이 뮤트되면
  #    다음 진짜 사고를 놓친다. 드레인 완료 후 별도 커밋으로 true 로 바꾼다.
  enabled: false
  schedule: "17 * * * *"
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  thresholdMinutes: 120
  heartbeatHourUtc: 1
