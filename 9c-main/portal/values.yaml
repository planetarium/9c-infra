portalService:
  name: portal
  hostnames:
    - "nine-chronicles.com"
    - "www.nine-chronicles.com"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  nodeSelector:
    node.kubernetes.io/type: baremetal
  image:
    repository: planetariumhq/9c-portal
    # NCU 연동상태 API (9c-portal#1278). 인게임 NCU 팝업이 이 엔드포인트를 부른다.
    #   POST /api/ncu/link-status — 9c 서명으로 by-address 연동상태 조회.
    #   지금 프로덕션은 이 경로가 404 라, 470 클라가 "조회 실패"로 표시된다.
    # 클라 쪽 PortalHost 는 이미 배포돼 있다(런처 config + 모바일 CLO 양쪽).
    #   따라서 이 배포만으로 클라 재빌드 없이 동작이 시작된다.
    tag: main-88fd914786574512aabab5f5e9a42d0853ca1f2e
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-main-v2/portal"
  env:
    NODE_ENV: production
    BASE_URL: "https://nine-chronicles.com"
    NEXT_PUBLIC_STATUS_SERVER_URL: "https://portal-status.nine-chronicles.com"
    S3_BANNER_BUCKET: "9c-portal-banner"
    BANNER_CLOUD_FRONT_DOMAIN: "https://d20llolvuaz1gj.cloudfront.net/"
    QA_ENABLED: false
    NEXT_PUBLIC_MAINNET_ENV: production
    NEXT_PUBLIC_PLANETARY_ENDPOINT: "https://planets.nine-chronicles.com/planets/"
backofficeService:
  name: backoffice
  hostname: "portal.planetarium.team"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  nodeSelector:
    node.kubernetes.io/type: baremetal
  image:
    repository: planetariumhq/9c-portal-backoffice
    tag: main-0dd2760b293051c07cedeb32e6f59575e95086c9
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-main-v2/backoffice"
  cronjobs:
    - name: withdrawal
      schedule: "*/2 * * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/withdrawal"
      tokenEnvName: "SCHEDULER_API_KEY"
    - name: withdrawal-status
      schedule: "*/15 * * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/transaction"
      tokenEnvName: "SCHEDULER_API_KEY"
    # 글로리 리딤 날짜별 통계 → Slack #9c-metrics (read-only 집계, 돈 액션 없음). 매일 10:00 KST(01:00 UTC).
    # ⚠️ 엔드포인트(9c-portal PR #1264)가 prod backoffice에 배포된 뒤 유효. 그 전엔 404(무해).
    - name: redeem-stats
      schedule: "0 1 * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/redeem-stats"
      tokenEnvName: "SCHEDULER_API_KEY"

# 지급 지갑 잔고 일일 리포트 → Slack #9c-metrics, 매일 10:00 KST(01:00 UTC).
# 주소는 portalService.env(NC_ADDRESS_PORTAL / NC_ADDRESS_NCG_VOUCHER)와 백오피스 KMS_MEAD_ADDRESS 기준.
# 셋 다 Odin 체인 계정이며, 크로스플래닛 출금도 Odin 지갑에서 나가므로 Odin만 조회한다.
walletBalanceReport:
  enabled: true
  schedule: "0 1 * * *"
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  gqlEndpoint: "https://odin-rpc-1.nine-chronicles.com/graphql"
  wallets:
    - label: "출금/리워드"
      address: "0x491d9842ed8f1b5d291272cf9e7b66a7b7c90cda"
      assets: ["NCG", "MEAD"]
    - label: "NCG 바우처"
      address: "0xc1Ea0D238f7b1C9c70Ce6589DAb2F15C1A076455"
      assets: ["NCG", "MEAD"]
    - label: "MEAD 지급"
      address: "0xc64c7cBf29BF062acC26024D5b9D1648E8f8D2e1"
      assets: ["MEAD"]
