portalService:
  name: portal
  hostnames:
    - "nine-chronicles.com"
    - "www.nine-chronicles.com"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  nodeSelector:
    node.kubernetes.io/type: baremetal
  image:
    repository: planetariumhq/9c-portal
    # 포탈 main 최신(673d1e71, #1307). 4e6e20b4..673d1e71 은 Rune Breaker 리브랜딩(#1306) 하나뿐.
    #   1) 표시 문자열 "Ragnarok Breaker" → "Rune Breaker" (NCU 카드 / Quests / Redeem /
    #      LinkedAccount "Rune Breaker Wallet" / V8Link "Rune Breaker(V8)" / 연동 모달 타이틀).
    #   2) web3 플레이 URL ragnarokbreaker.fun → runebreaker.nine-chronicles.com
    #      (기존 prod-ragnarokbreaker-fun.pages.dev 로 가는 CNAME, https 200).
    #   ⚠️ NCU 응답 와이어 키(ragnarok_breaker / ragnarok_wallet)는 그대로다 — 배포된 유니티
    #      클라(470.0.11 / 480.0.1)가 상수로 못박고 정확 일치로 찾으며, 못 찾으면 에러가 아니라
    #      조용히 미연동으로 떨어진다. 표기만 바꾼 배포라 클라 영향 없음.
    # DB 마이그레이션 커플링 없음 — 4e6e20b4..673d1e71 에 packages/database 변경이 없다.
    tag: main-7dff2fe4e85da369c597e8b899df631c8ed4643c
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-main-v2/portal"
  env:
    NODE_ENV: production
    BASE_URL: "https://nine-chronicles.com"
    NEXT_PUBLIC_STATUS_SERVER_URL: "https://portal-status.nine-chronicles.com"
    S3_BANNER_BUCKET: "9c-portal-banner"
    BANNER_CLOUD_FRONT_DOMAIN: "https://d20llolvuaz1gj.cloudfront.net/"
    QA_ENABLED: false
    NEXT_PUBLIC_MAINNET_ENV: production
    NEXT_PUBLIC_PLANETARY_ENDPOINT: "https://planets.nine-chronicles.com/planets/"
backofficeService:
  name: backoffice
  hostname: "portal.planetarium.team"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  nodeSelector:
    node.kubernetes.io/type: baremetal
  image:
    repository: planetariumhq/9c-portal-backoffice
    # 백오피스 main 최신(fd8b3f10, #1309). 673d1e71..fd8b3f10 은 출금 Approval 테이블
    #   Action 열 위치 조정(#1308) 하나뿐 — 열 순서만 Amount 뒤로 옮긴 UI 변경이고
    #   승인 권한 검사(canWithdrawalApprove)·승인 API·출금 스케줄러 동작은 그대로다.
    # ⚠️ 포탈 태그(L23)는 673d1e71 유지 — 이번 diff 에 apps/portal 변경이 없어
    #   포탈 이미지는 코드상 동일하다. 굳이 bump 하면 프로브 없는 prod 포탈 pod 만
    #   불필요하게 재기동되므로 백오피스만 올린다.
    # DB 마이그레이션 커플링 없음 — packages/database 변경 없음.
    tag: main-7dff2fe4e85da369c597e8b899df631c8ed4643c
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-main-v2/backoffice"
  cronjobs:
    - name: withdrawal
      schedule: "*/2 * * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/withdrawal"
      tokenEnvName: "SCHEDULER_API_KEY"
    - name: withdrawal-status
      schedule: "*/15 * * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/transaction"
      tokenEnvName: "SCHEDULER_API_KEY"
      # 평시 7~9초지만 핸들러가 미확정 tx 를 14일 창으로 훑고 **행마다 GraphQL 을 2번** 친다
      # (take 상한 없음). 백로그 드레인 구간엔 후보가 수백 행까지 차올라 기본 100초를 넘긴다.
      # ADS 는 615초로 15분 주기보다 훨씬 짧아 인바리언트(ADS < 주기)는 유지된다.
      timeoutSeconds: 600
    # 글로리 리딤 날짜별 통계 → Slack #9c-metrics (read-only 집계, 돈 액션 없음). 매일 10:00 KST(01:00 UTC).
    # ⚠️ 엔드포인트(9c-portal PR #1264)가 prod backoffice에 배포된 뒤 유효. 그 전엔 404(무해).
    - name: redeem-stats
      schedule: "0 1 * * *"
      endpoint: "https://portal.planetarium.team/api/scheduler/redeem-stats"
      tokenEnvName: "SCHEDULER_API_KEY"
      # 일 1회라 다음 tick 이 24시간 뒤다 — 일시적 실패 한 번이 하루치 리포트 결손이 된다.
      # (이미지가 :latest 라 pull 이 Always 이고, 이 클러스터는 DockerHub 간헐 실패 이력이 있다.)
      # 재시도가 ADS 안에 들어가도록 timeout 도 함께 올린다. 315초 ≪ 24시간.
      backoffLimit: 2
      timeoutSeconds: 300

# 지급 지갑 잔고 일일 리포트 → Slack #9c-metrics, 매일 10:00 KST(01:00 UTC).
# 주소는 portalService.env(NC_ADDRESS_PORTAL / NC_ADDRESS_NCG_VOUCHER)와 백오피스 KMS_MEAD_ADDRESS 기준.
# 셋 다 Odin 체인 계정이며, 크로스플래닛 출금도 Odin 지갑에서 나가므로 Odin만 조회한다.
walletBalanceReport:
  enabled: true
  schedule: "0 1 * * *"
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  # odin-rpc-1 을 쓰지 말 것 — nginx 경유 remote-headless-1 단일 매핑(StreamingHub sticky)
  # 이라 rh-1 이 내려가면 백업 upstream 없이 502 가 된다. 2026-09-26 실제로 이 리포트가
  # "조회 실패" 로 나갔다. odin-gql 은 upstream 이 [rh-1, validator-5] 라 한쪽이 죽어도
  # 살아남고, 복구되면 자동으로 다시 분산된다.
  gqlEndpoint: "https://odin-gql.nine-chronicles.com/graphql"
  wallets:
    - label: "출금/리워드"
      address: "0x491d9842ed8f1b5d291272cf9e7b66a7b7c90cda"
      assets: ["NCG", "MEAD"]
    - label: "NCG 바우처"
      address: "0xc1Ea0D238f7b1C9c70Ce6589DAb2F15C1A076455"
      assets: ["NCG", "MEAD"]
    - label: "MEAD 지급"
      address: "0xc64c7cBf29BF062acC26024D5b9D1648E8f8D2e1"
      assets: ["MEAD"]

# 출금 적체 감시 (차트 values 의 주석에 배경). 잔고 리포트와 같은 채널·같은 봇 토큰을 쓴다.
withdrawalBacklogAlert:
  # ⚠️ 2026-09-21 적체(959건)를 드레인하는 동안은 켜지 않는다 — 이미 알고 있고 이미
  #    대응 중인 건으로 시간당 1건씩 #9c-metrics 를 때리게 된다. 채널이 뮤트되면
  #    다음 진짜 사고를 놓친다. 드레인 완료 후 별도 커밋으로 true 로 바꾼다.
  enabled: false
  schedule: "17 * * * *"
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  thresholdMinutes: 120
  heartbeatHourUtc: 1
