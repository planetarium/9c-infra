externalSecretKey: petpop/prod

server:
  enabled: true
  image:
    repository: planetariumhq/petpop
    tag: server-36cf35f94fb3147357149d5b6702eab0e56d0d5e
  hostnames:
    - petpop.fun
    - www.petpop.fun
  hpa:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  nodeSelector:
    node.kubernetes.io/type: general

backoffice:
  enabled: true
  image:
    repository: planetariumhq/petpop
    tag: server-36cf35f94fb3147357149d5b6702eab0e56d0d5e
  hostname: petpop-backoffice.9c.gg
  nodeSelector:
    node.kubernetes.io/type: general

workers:
  image:
    repository: planetariumhq/petpop
    tag: worker-36cf35f94fb3147357149d5b6702eab0e56d0d5e
  nodeSelector:
    node.kubernetes.io/type: general
  rankingWorker:
    enabled: true
  blockResetWorker:
    enabled: true
  # 매일 Slack 으로 보내던 "[mainnet] KAIA Wallet Monitor" 잔고 리포트는 더 받지 않는다(2026-10-19).
  walletMonitorWorker:
    enabled: false
  # 쓰기는 petpop-env SEASON_AUTOMATION_END_ENABLED=true 전까지 꺼져 있다(dry-run 보고만).
  # 워커 이미지가 season-automation 을 아는 태그로 올라갈 때 같은 커밋에서 true 로(옛 이미지는 인자를 모르고 조용히 종료).
  seasonAutomation:
    enabled: true
    # 지급 스위치(시즌 종료 보상 자동 지급). 끄려면 "false" — 즉시 멈추려면 CronJob suspend.
    #   (2026-10-23) prod 모의 실행·동글이 중계 확인 후 켬. 시즌 17 종료(10/26 08:00 UTC) 뒤 첫 스냅샷에서 지급.
    env:
      SEASON_AUTOMATION_END_ENABLED: "true"
  # 보존 정리(History 30일·UpdateNoti 90일·만료 DAILY/WEEKLY UserQuest 30일), 매일 04:00 KST.
  #   RETENTION_ENABLED 가 "true" 가 아니면 건수만 센다 — dry-run 확인 후 켠다.
  retention:
    enabled: true
    schedule: "0 19 * * *"
    env:
      RETENTION_ENABLED: "false"
