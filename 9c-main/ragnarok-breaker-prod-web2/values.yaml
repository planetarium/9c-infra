externalSecretKey: ragnarok-breaker/prod-web2

imagePullSecret:
  secretKey: ragnarok-breaker/dockerhub

worker:
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c

v8Gateway:
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c

logStream:
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c

# Anti-cheat → Slack alert worker (prod only). SLACK_VIOLATION_WEBHOOK_URL is
# read from the ragnarok-breaker-env SecretsManager entry for this namespace.
anticheatAlertWorker:
  enabled: true
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c

# 메일 지급 워커 — prod web2 활성화. tag = petpop build:mail-send-worker 산출 이미지
#   (env-agnostic, SM 으로 env 주입 → staging 검증 이미지 재사용).
# 호스트명은 /mail-send 스킬의 mailSendWorkerUrlOf('prod','web2') 파생값과 1:1 일치해야 함.
# 발송 계정: MAIL_SENDER_V8_* 미설정 시 ragnarok-breaker/prod-web2 의 V8_ACCOUNT/_VERSE/_AUTH/_ENV
#   로 폴백. 해당 계정이 prod verse 에서 mailSendWorker role 로 등록돼 있어야 실제 발송 가능.
# 선택: Slack 알림은 AWS SM 에 MAIL_SEND_SLACK_WEBHOOK 추가 시 활성(미설정 시 skip).
mailSendWorker:
  enabled: true
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c
  httpRoute:
    enabled: true
    hostnames:
      - rb-mail-send-prod-web2.9c.gg

# 리그 보상 메일 워커 — prod 실지급. 같은 네임스페이스 mailSendWorker(위)를 내부 DNS 호출.
# ⚠ ArgoCD sync(=워커 기동) 전 필수:
#   (1) 이 verse Redis 의 SET `league-reward:paid` 에 이미 수동 지급된 리그 시즌 id 를 전부
#       SADD. 구 manual 도구(sendUserMailBatch)는 서버 receipt 를 안 남겨 결정론 jobId dedup 이
#       안 걸리므로, 미시딩 시 7일 lookback 안의 수동 지급 시즌을 재지급(이중지급)한다.
#   (2) AWS SM ragnarok-breaker/prod-web2 에 R2_PUBLIC_BASE·CDN_ENV 존재 확인.
#   발송계정(0x3c33)은 worker.records·user.read·mail.send 보유(확인됨).
leagueRewardWorker:
  enabled: true
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c
  config:
    verseLabel: prod-w2

# Fólkvangr 시즌 보상 자동 지급 워커 — prod web2.
# league-reward-worker 와 같은 Redis·시크릿을 쓰되 큐 prefix/상태 키가 갈려 있다.
#
# ⚠️ **일부러 enabled:false 로 둔다.** ArgoCD 가 자동 sync 이므로 true 로 머지되면
# 그 순간 배포되는데, 아직 이미지 태그를 핀하지 않았다(mutable 'develop' 은
# pullPolicy:IfNotPresent 와 겹쳐 노드에 남은 옛 레이어가 갱신되지도 않는다).
# 켜는 순서: ① AWS SM ragnarok-breaker/prod-web2 에 env 추가
#            ② build:folkvangr-reward-worker 가 push 한 :git-<sha> 로 tag 핀
#            ③ enabled:true 로 바꿔 별도 PR
folkvangrRewardWorker:
  enabled: false
  image:
    tag: develop
  config:
    verseLabel: prod-w2

# Playfull CPE 아웃바운드 워커 — prod web2 활성화 (per-env consumer, own Redis).
# 파이프라인: 게임서버가 검증된 stage_clear 시 playfull_event 로그 emit
#   → log-stream 이 playfull-event 큐로 라우팅(LOG_STREAM_ENABLE_PLAYFULL=true 일 때만)
#   → 이 워커가 소비해 HMAC 서명 후 Playfull Events API 로 POST.
# 워커는 V8 의존이 없다 — 잡을 받아 서명 후 POST 할 뿐. tag = staging 검증 이미지 재사용.
#
# ⚠ sync 전 AWS SM ragnarok-breaker/prod-web2 에 아래 키 추가 필요:
#     PLAYFULL_CLIENT_ID / PLAYFULL_CLIENT_SECRET / PLAYFULL_GAME_ID
#     PLAYFULL_DRY_RUN=true            (실 전송 없이 서명·바디만 로그. 검증 후 false)
#     LOG_STREAM_ENABLE_PLAYFULL=true  (log-stream 이 큐로 라우팅. 미설정 시 emit drop)
#     PLAYFULL_V8_ADMIN_TOKEN          (선택 — 지갑→이메일 귀속. 없으면 지갑 식별자만으로 흐름)
#
# ⚠ 순서: 워커가 먼저 뜬 뒤 LOG_STREAM_ENABLE_PLAYFULL 을 켠다.
#   반대로 하면 컨슈머 없는 큐에 잡이 적체된다.
playfullWorker:
  enabled: true
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c

# web2→web3 계정 이전 브리지 — web2 verse 네임스페이스에 배치(크로스-verse 싱글톤).
# staging(9c-internal/ragnarok-breaker-staging-web2)과 동일한 형태.
# ⚠ 반드시 이 한 네임스페이스에서만 enable — ragnarok-breaker-prod-web3 / ragnarok-breaker-prod
#   에는 절대 켜지 말 것 (두 인스턴스가 같은 web2 큐를 폴링. claim CAS + (P,A) 멱등이라
#   중복 크레딧은 안 나지만 낭비이고 로그가 오염된다).
# ⚠ sync 전 AWS SM ragnarok-breaker/prod-web2 에 web2·web3 두 verse 자격증명 모두 추가:
#     MIGRATION_BRIDGE_WEB2_V8_{ACCOUNT,VERSE,ENV,AUTH,REMOTE_URL}
#     MIGRATION_BRIDGE_WEB3_V8_{ACCOUNT,VERSE,ENV,AUTH,REMOTE_URL}
#   (파드 위치와 무관하게 web3 는 게이트웨이 URL+bearer 로 도달하므로 web3 자격증명도 여기 필요)
#   ACCOUNT 는 admin.ts migrationBridgeWorker role 계정(0x3c33…48c8), ENV=prod 면 AUTH 필수.
# (선택) MIGRATION_BRIDGE_{POLL_INTERVAL_MS,BATCH_LIMIT,STALE_PROCESSING_MS}
#   미설정 시 10s / 20건 / 5분. 실패 레코드는 STALE_PROCESSING_MS 경과 후 재시도.
migrationBridge:
  enabled: true
  image:
    tag: git-8d614bb88a9c18894adce6453748b6f92243163c
