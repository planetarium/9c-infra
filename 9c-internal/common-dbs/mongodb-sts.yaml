apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: mongodb
    app.kubernetes.io/instance: common-dbs
  name: mongodb
  namespace: common-dbs
spec:
  replicas: 1
  serviceName: mongodb
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.3.8@sha256:5211c51171f57ae60842b11664bb244628971b3d35325762a97888337b9bb0db  # 2026-11-04 실행 중 이미지 고정
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "root"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: MONGODB_PASSWORD
          volumeMounts:
            - mountPath: /data/db
              name: mongodb-data
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: common-dbs-longhorn
        volumeMode: Filesystem
