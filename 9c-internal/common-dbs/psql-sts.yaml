apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: psql
    app.kubernetes.io/instance: common-dbs
  name: psql
  namespace: common-dbs
spec:
  replicas: 1
  serviceName: psql
  selector:
    matchLabels:
      app: psql
  template:
    metadata:
      labels:
        app: psql
    spec:
      # 2026-11-04 침해 대응: DB 컨테이너가 장악돼도 k8s 토큰을 못 쓰게
      automountServiceAccountToken: false
      # postgres(999)로 바로 실행 — 이미지 시작 스크립트가 root 일 때만 PGDATA 소유권을 바꾸는데,
      # 읽기 전용 postgresql.auto.conf 에서 실패해 기동이 안 된다(2026-11-04).
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: psql
          image: postgres:15.19@sha256:40e8c839f86c404f9bd1c456bb83f11b205f2cd95d753b34c2d074e89ecee786  # 2026-11-04 실행 중 이미지 고정(태그만 쓰면 재시작 때 glibc 가 바뀌어 collation 재색인 필요)
          # 명령줄 -c 는 postgresql.auto.conf(ALTER SYSTEM)보다 우선 — 2026-11-02·04 공격(ssl_passphrase_command 셸 실행)을
          # ALTER SYSTEM 으로 다시 심어도 효과가 없게 고정. 접속·DDL 은 로그로 남긴다(출처 추적).
          args:
            - -c
            - ssl=off
            - -c
            - ssl_passphrase_command=
            - -c
            - archive_mode=off
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_statement=ddl
            # 2026-11-04 2차: 접속 때 공격자 .so 를 불러오게 한 수법(session_preload_libraries) 차단
            - -c
            - session_preload_libraries=
            - -c
            - local_preload_libraries=
            - -c
            - shared_preload_libraries=
            - -c
            - dynamic_library_path=$libdir
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "root"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: psql-data
            # ALTER SYSTEM 자체를 막는다: postgresql.auto.conf 를 읽기 전용 빈 파일로 덮어씀(쓰기·rename 실패)
            - mountPath: /var/lib/postgresql/data/pgdata/postgresql.auto.conf
              name: autoconf-ro
              subPath: postgresql.auto.conf
              readOnly: true
      volumes:
        - name: autoconf-ro
          configMap:
            name: psql-autoconf-ro
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
    - metadata:
        name: psql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: common-dbs-longhorn
        volumeMode: Filesystem
