portalService:
  name: portal
  hostname: "developer-mode.nine-chronicles.com"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  image:
    repository: planetariumhq/9c-portal
    # 복권 테스트 핀(test-monorepo, 2026-08-13 빌드) 해제 → develop 최신(floating).
    #   ⚠️ internal-latest 에는 복권 백엔드가 없다(9c-portal#1276 이 develop 에 아직 open).
    #     인터널 IAP 는 voucher_grant_enabled=true 로 남겨두기로 했으므로, product 111
    #     결제가 나면 /api/voucher/grant 가 404 → outbox FAILED + Slack 알람이 뜬다.
    #     404 는 transient 도 retryable 도 아니라 재시도되지 않는다. 의도된 트레이드오프이며,
    #     조용히 하려면 WORKER_VOUCHER_GRANT_ENABLED=false 또는 매핑 active=false 로.
    tag: "internal-latest"
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-internal-v2/portal"
  env:
    NODE_ENV: development
    BASE_URL: "https://developer-mode.nine-chronicles.com"
    NEXT_PUBLIC_STATUS_SERVER_URL: "https://9c-status-portal.s3.ap-northeast-2.amazonaws.com"
    S3_BANNER_BUCKET: "9c-portal-banner-dev"
    BANNER_CLOUD_FRONT_DOMAIN: "https://d3hdj186tjvpbo.cloudfront.net/"
    QA_ENABLED: true
    NEXT_PUBLIC_MAINNET_ENV: local
    NEXT_PUBLIC_PLANETARY_ENDPOINT: "https://planets-internal.nine-chronicles.com/planets/"
backofficeService:
  name: backoffice
  hostname: "dev-portal.planetarium.team"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  image:
    repository: planetariumhq/9c-portal-backoffice
    tag: "internal-latest" # 포탈과 동일하게 develop 최신(floating)으로 복구
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-internal-v2/backoffice"
  cronjobs:
    - name: withdrawal
      schedule: "*/2 * * * *"
      endpoint: "https://dev-portal.planetarium.team/api/scheduler/withdrawal"
      tokenEnvName: "SCHEDULER_API_KEY"
    - name: withdrawal-status
      schedule: "*/15 * * * *"
      endpoint: "https://dev-portal.planetarium.team/api/scheduler/transaction"
      tokenEnvName: "SCHEDULER_API_KEY"
    # (통합 포인트) 구 리딤 지급/재확정 CronJob(redeem, redeem-status) 제거 — glory 소각분은 reward(GLORY_REDEEM)로
    #   크레딧돼 통합 withdrawal이 지급하므로 별도 리딤 지급 스케줄러 불요. 살려두면 이중지급 경로가 됨(리뷰 B).
