portalService:
  name: portal
  hostname: "developer-mode.nine-chronicles.com"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  image:
    repository: planetariumhq/9c-portal
    # (2026-08-26) test-monorepo 핀 해제 → develop 최신(floating)으로 복구.
    #   복권 스택 8 건이 develop 에 머지됐다: #1276(코어)·#1284(상금표 admin+R2 retryable)·
    #   #1287(C5 TOCTOU 하드닝)·#1282(플랫폼 배수)·#1283(전체 개봉)·#1285(밴 게이트)·
    #   #1286(일 상한 집계 인덱스)·#1288(웹샵 상품에 티켓 표시).
    #   그래서 test-monorepo 핀의 존재 이유("develop 엔 복권 백엔드가 없다")가 사라졌다.
    #
    #   이 복구가 동시에 푸는 것:
    #     1. /api/admin/voucher-policy 404 → 백오피스 허브 /voucher-config 화면이 열린다.
    #        (화면 Load() 가 정책 GET 실패 시 본문 전체를 렌더하지 않아 매핑 UI 까지 안 보였다)
    #     2. 웹샵 상품 카드·상세에 복권 티켓 표시(#1288). IAP 는 이미 voucher_ticket_list 를
    #        응답에 싣고 있다(NineChronicles.IAP#487, 인터널 배포 완료) — 그릴 코드가 없었다.
    #
    #   ⚠️ 배포 후 마이그레이션 1 건을 수동 적용할 것 — 이미지 CMD 가 `node server.js` 라
    #     부팅 시 prisma migrate deploy 를 돌리지 않는다. 인터널 DB 의 마지막 적용은
    #     20260803090100_add_reward_source_shop_draw 이고, 다음이 빠져 있다:
    #       20260826090000_add_purchase_voucher_status_opened_at_index
    #     (CREATE INDEX ix_purchase_voucher_status_opened_at ON purchase_voucher(status, opened_at))
    #     지금은 dailyIssuanceCapNcg=null 이라 그 집계를 부르지 않으니 기능은 안 깨진다 —
    #     일 상한을 켜기 전에는 반드시 선행돼야 한다.
    # floating(internal-latest)이 아니라 sha 핀인 이유 — 복권 8 건이 develop 에 개별 push 로
    #   들어가 build-and-push 8 런이 동시에 돌았고, 이 워크플로엔 concurrency: 가 없다.
    #   8 런 모두 internal-latest 를 덮으므로 **커밋 순서와 무관하게 마지막에 끝난 런이 이긴다.**
    #   실측: 14:22 internal-latest=e63f9d32(#1284) → 14:23 afa97463(#1282) 로 **뒤로 갔다**
    #   (그 사이 더 나중 커밋 778812c4 가 푸시됐는데도). 즉 floating 이면 #1288(웹샵 표시)이
    #   빠진 이미지로 굳을 수 있고, develop 에 다음 push 가 올 때까지 스스로 교정되지 않는다.
    #   게다가 이 배포는 마이그레이션을 수동으로 맞추는데 pullPolicy: Always + floating 이면
    #   노드 드레인·eviction 으로 pod 가 재기동될 때마다 그 시점 develop 빌드를 조용히 집어온다.
    #   프로드가 main-<sha> 로 핀하는 것과도 대칭이다. 안정화 후 internal-latest 로 되돌려도 된다.
    #
    #   (2026-08-27) 9c-portal#1289 로 재핀. 카드(미리보기)가 복권 티켓을 **합계 한 줄**로만
    #     보여줘서 STANDARD/PREMIUM 구분이 안 됐다 — 상금 규모가 종류로 갈리니 "3장" 은
    #     비교에 쓸 수 없는 정보다. 카드도 종류별 한 줄씩 내고, 카드·모달이 표시 순서를
    #     공유하게 했다(전엔 양쪽이 IAP 응답 순서를 그대로 써서 화면마다 순서가 달라질 수 있었다).
    #
    #     핀이 95f2a4db 가 아니라 daaab598 인 이유: GitHub Actions 장애로 95f2a4db 의 develop
    #     push 런이 job 0 개인 채 queued 로 고착돼 **이미지가 만들어지지 않았다**(cancel 은
    #     "completed 라 취소 불가", rerun 은 "workflow file may be broken" 으로 둘 다 거부).
    #     on: 에 workflow_dispatch 도 없어 수동 트리거가 불가능했다 → 그 트리거를 추가하는
    #     9c-portal#1290 을 머지해 그 push 로 빌드를 되살렸다. daaab598 = #1289(카드 뱃지
    #     종류별) + #1290(dispatch). 95f2a4db 태그는 지금도 레지스트리에 없다.
    #
    #     (2026-08-27) 8e9e52c5 로 재핀:
    #       #1291 마일리지·복권 뱃지 배경을 신규 리본으로 통일(카드·모달 × 마일리지·복권
    #             네 자리 전부) + 티켓 종류별 아이콘(PREMIUM/STANDARD/기본).
    #       #1292 Earn 메뉴에 Voucher 탭 노출 — 런칭 게이트 해제. 페이지는 진작부터
    #             /earn#Voucher 로 동작했고 nav 항목만 없었다.
    #       ⚠️ 그 nav 는 환경 분기가 없다(useNav 는 국가만 거른다) → develop→main 머지
    #          시 **프로덕션에도 그대로 뜬다.** 프로드 런칭 시점을 따로 잡으려면 환경
    #          플래그가 필요하다.
    #
    #     (2026-08-27) 9c-portal#1293 — 상세 모달에서 마일리지 뱃지가 복권 리본에 가려지던 것.
    #       마일리지 bottom-32 / 복권 bottom-16 으로 좌표를 따로 줬는데, 복권이 종류별 여러 줄로
    #       늘고 리본으로 커지면서 범위가 겹쳤다(복권 2줄 64~180px, 마일리지 128~184px).
    #       같은 z-10 인데 복권이 DOM 뒤라 위에 그려져 마일리지가 완전히 덮였다.
    #       → 두 뱃지를 flex-col 하나로 합쳐 줄 수와 무관하게 쌓이게 했다.
    #
    #     (2026-08-27) 9c-portal#1294 — 복권 티켓 수량 표기에서 "x" 제거(x2 → 2).
    #       같은 리본 묶음의 마일리지는 48 처럼 숫자만 내는데 복권만 x2 라 표기가 섞였다.
    #       종류는 아이콘(금관=PREMIUM / 은관=STANDARD)이 구분하므로 숫자만으로 충분하다.
    #
    #     (2026-08-27) 9c-portal#1295 — 리본 뱃지 내용이 아래로 쏠리던 것.
    #       리본 아트는 몸통이 위쪽이고 아래로 접힘이 있다(s: 49 중 8px, l: 101 중 18px).
    #       전체 높이 기준 중앙 정렬이라 접힘 쪽으로 밀렸다 → 접힘 비율만큼 아래 여백을
    #       줘 몸통 안에서 중앙이 되게 했다. 상세는 아이콘–숫자 간격도 6 → 12.
    #
    #     (2026-08-28) QA 지적 4건(PLD-1534~1537) — 9c-portal#1296.
    #       1534 개봉 후 잔고가 새로고침해야 반영: 잔고 키가 둘(userAssetsAPIPath=헤더,
    #            useAccount=Play 탭·출금)인데 목록만 되살리고 있었다 → 셋 다 무효화.
    #       1536 상금 단위 NCG → PTS. 개봉이 실제로 주는 건 reward(SHOP_DRAW) 크레딧
    #            (= 포탈 포인트)이고 NCG 실지급은 통합 withdrawal 담당이라, 화면에 NCG 를
    #            쓰면 지급물과 단위가 어긋났다. 헤더 잔액은 원래 포인트였다.
    #       1535 복권 화면 영문화. 등수 라벨은 코드가 아니라 **정책 데이터**라 라이브
    #            인터널 정책도 같이 갱신했다(1등/꽝 → 1st/No prize, 상금·확률 불변).
    #       1537 지급까지 몇 분 걸린다는 안내(워커 beat 2분 주기).
    #
    #     (2026-08-28) 개봉 연출 + 확률공시 정리 — 9c-portal#1297.
    #       복권을 열면 카드가 뒤집히며 결과가 나온다(단건·전체 공통). 등급은 이름이 아니라
    #         **그 티켓의 결제 플랫폼 상금표에서의 금액 순위**로 정한다 — 등수 라벨과 단계 수가
    #         정책 데이터라 고정 키를 코드에 박으면 정책이 바뀔 때 조용히 어긋난다.
    #       전체 개봉은 상위 N장이 아니라 **최고 1장 + 무작위 표본**으로 10장만 연출한다.
    #         상위만 남기면 95꽝/5당첨이 승률 50%처럼 보인다(확률공시 아래 있는 기능이다).
    #       확률공시에서 PC/모바일 표가 값이 같으면 합치고(현재 배수 1/1), 기대값(EV)은 뺐다.
    #
    #     (2026-08-28) QA 지적 2건(PLD-1540·1541) — 9c-portal#1298.
    #       1540 보상 히스토리에 멱등키가 그대로 노출됐다("SHOP_DRAW:123"). reward.reason 은
    #            설명이 아니라 멱등키라, 표시 라벨은 source 로 만든다(PLD-1443 과 같은 방식).
    #            종류는 reward 행에 없어 refId(=바우처 PK)로 되짚는다 — 페이지당 PK IN 1회.
    #            DB 에 텍스트를 안 넣으므로 이미 쌓인 행에도 소급 적용된다(백필 불필요).
    #       1541 지급된 티켓이 F5 전까지 목록에 안 보였다. useVoucherList 가 useSWRImmutable
    #            이라 재검증이 전부 꺼져 있었고, 개봉 후 mutate 는 개봉 경로에만 있어 신규
    #            지급에는 갱신 트리거가 아예 없었다. **이 훅만** useSWR + 60초 폴링으로.
    #            immutable 은 포탈 전역 관례(20개 이상 훅)라 공용 설정은 건드리지 않았다.
    #
    #     (2026-08-31) 플랫폼 배수를 상금 → **발급 티켓 수**로 (PLD-1477) — 9c-portal#1301.
    #       확률공시를 한 벌로 만들려는 변경이다. 상금에 곱하면 PC/모바일 표가 갈리는데,
    #         티켓 수로 옮기면 상금·확률이 플랫폼 무관해져 공시표가 하나로 끝난다.
    #       ⚠️ 내림이라 매핑 count 가 작으면 실효가 없다(1장 × 1.25 = 1장). 활성 매핑 6건 중
    #         5건이 여기 해당 — **배수를 켤 때는 상품 매핑 count 도 같이 키워야 한다.**
    #       라이브 배수가 현재 PC/MOBILE 모두 1.0 이라 이 배포만으로는 동작이 안 바뀐다.
    #         (소급 손실 없음도 그래서다 — 배수 1 이면 상금이 곱해진 적이 없다.)
    #       샵 뱃지도 같은 함수로 실효 장수를 표시한다(웹샵 결제는 언제나 PC).
    #
    #     (2026-08-31) 다른 작업 동승 — 9c-portal#1300 "IAP 구매 미션 5종 종료(9/1 00:00 KST)".
    #       develop head 로 핀을 올리므로 함께 배포된다.
    tag: "internal-fc4605bb1633764743fa8036c07d8916f5e3c733"
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-internal-v2/portal"
  env:
    NODE_ENV: development
    BASE_URL: "https://developer-mode.nine-chronicles.com"
    NEXT_PUBLIC_STATUS_SERVER_URL: "https://9c-status-portal.s3.ap-northeast-2.amazonaws.com"
    S3_BANNER_BUCKET: "9c-portal-banner-dev"
    BANNER_CLOUD_FRONT_DOMAIN: "https://d3hdj186tjvpbo.cloudfront.net/"
    QA_ENABLED: true
    NEXT_PUBLIC_MAINNET_ENV: local
    NEXT_PUBLIC_PLANETARY_ENDPOINT: "https://planets-internal.nine-chronicles.com/planets/"
backofficeService:
  name: backoffice
  hostname: "dev-portal.planetarium.team"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  image:
    repository: planetariumhq/9c-portal-backoffice
    # 포탈과 같은 커밋으로 핀. develop **push 에서는 경로 필터와 무관하게** backoffice 도
    #   항상 빌드된다(paths-filter 는 pull_request 이벤트용). 그리고 이 스택엔 apps/backoffice
    #   코드 변경이 0 건이다 — packages/database 만 바뀌었으니 prisma 클라이언트 재생성
    #   (신규 모델 + reward source SHOP_DRAW)만 태우는 리빌드다. 그 enum 은 8/5 에 DB 적용됨.
    tag: "internal-fc4605bb1633764743fa8036c07d8916f5e3c733"
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-internal-v2/backoffice"
  cronjobs:
    - name: withdrawal
      schedule: "*/2 * * * *"
      endpoint: "https://dev-portal.planetarium.team/api/scheduler/withdrawal"
      tokenEnvName: "SCHEDULER_API_KEY"
    - name: withdrawal-status
      schedule: "*/15 * * * *"
      endpoint: "https://dev-portal.planetarium.team/api/scheduler/transaction"
      tokenEnvName: "SCHEDULER_API_KEY"
    # (통합 포인트) 구 리딤 지급/재확정 CronJob(redeem, redeem-status) 제거 — glory 소각분은 reward(GLORY_REDEEM)로
    #   크레딧돼 통합 withdrawal이 지급하므로 별도 리딤 지급 스케줄러 불요. 살려두면 이중지급 경로가 됨(리뷰 B).
