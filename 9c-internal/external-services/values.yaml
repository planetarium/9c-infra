clusterName: 9c-internal
provider: RKE2

externalSecret:
  enabled: true
  provider: AWS
  prefix: "9c-internal-v2/external-services"

gateway:
  enabled: true
  services:
  - name: seasonpass-api-service
    hostnames:
    - seasonpass-internal.9c.gg
  - name: iap-backoffice
    hostnames:
    - iap-internal-backoffice.9c.gg
  - name: iap-api
    hostnames:
    - iap-internal-api.9c.gg

volumeReclaimPolicy: "Retain"

seasonpass:
  enabled: true
  image:
    tag: "git-3c29100ff62f588ecf14dd50e48527c55bb02fe3"

  api:
    enabled: true
    stage: "internal"
    resources:
      limits:
        cpu: 0.5
        memory: 1Gi

    # /ping is a sync FastAPI route that runs in the same threadpool as
    # request handlers, so it queues when the threadpool is exhausted by
    # blocked GQL calls — exactly the hang signature we want to detect.
    livenessProbe:
      httpGet:
        path: /ping
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ping
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  worker:
    enabled: true
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-internal-v2-seasonpass-worker"
    flower:
      enabled: true
    resources:
      limits:
        cpu: 0.5
        memory: 1Gi

  tracker:
    enabled: true

    odin:
      planetId: "0x100000000000"
    heimdall:
      planetId: "0x100000000001"
    thor:
      planetId: "0x100000000003"

    resources:
      limits:
        cpu: 0.5
        memory: 1Gi

iap:
  enabled: true
  backoffice:
    # enabled: false — 인터널 백오피스는 안 뜬다. bump-image.sh 가 세 태그를 함께 올리므로
    #   같이 바뀌지만 무의미하다(파드 없음).
    enabled: false
    image:
      tag: "git-03ad60b1f4e54e469b3b5af9cc53b4db8381b7e7"


  api:
    enabled: true
    stage: "internal"
    image:
      # main HEAD 빌드. 메인넷(9c-main/external-services)과 같은 이미지다.
      #   #482(영수증 중복 레이스 핫픽스)·#476(복권 admin/worker 체인 PLD-1468~1472)이
      #   모두 main 에 머지돼 있어, 브랜치 핀을 유지할 이유가 없어졌다.
      #   apps/api 는 지금 도는 ff5e2051 과 바이트 단위로 동일하다(diff 0) — 즉 이 bump 는
      #   api 기능 변경이 아니라 태그 정렬이다.
      #
      # DB: 인터널 alembic head 는 9c1e2f3a4b5c 이고 purchase_signal 테이블이 없다.
      #   그래도 이 이미지로 올려도 된다 — purchase_signal 은 모델·enum 만 있고 런타임에서
      #   쿼리하지 않는다(사용처는 #478, 아직 open). 지금 도는 ff5e2051 이 이미 그 모델과
      #   마이그레이션 파일을 포함한 채 정상 가동 중이다.
      #   다만 head 정합은 #478 배포 전 / PLD-1510(alembic 자동화) 때 맞출 것.
      #
      # (2026-08-26) 복권 관련 4건이 main 에 머지돼 다시 정렬한다.
      #   #483 감시 쿼리 부분 인덱스 — 마이그레이션 d2f4a1c6e8b3 이 트리에 있지만 **인터널엔
      #     불필요**하다(receipt 7.5k행, 순차 스캔이 무의미). 메인넷엔 이미 라이브 적용됨.
      #   #484 복권 티켓 매핑을 결제 상품(IAP)에만 — admin PUT/CSV 400, 워커 enroll 제외.
      #     ⚠️ 인터널의 유일한 active 매핑이 product 111(g_pkg_freedaily200, FREE)이라
      #        **이 배포 후 인터널 복권 발급이 멈춘다**(설계대로). 아래 worker 주석 참조.
      #   #486 발급 대상 스토어 게이트를 stage in ("production","mainnet") 으로.
      #     인터널은 stage="internal" 이라 전후 동일하게 TEST 스토어 포함 — e2e 영향 없음.
      #   #487 상품 응답에 voucher_ticket_list(종류·장수) 노출. 매핑이 없거나 비IAP 면 빈 리스트라
      #     지금 인터널 응답엔 아무것도 안 실린다(111 이 C6 에 걸림). 포탈 웹샵 표시는 9c-portal#1288.
      #
      # DB: alembic head 는 여전히 9c1e2f3a4b5c(purchase_signal 없음). 위 4건 중 **필요한
      #   마이그레이션이 없다** — #483 의 인덱스는 성능용이고 나머지는 스키마 무변경이다.
      #
      # (2026-09-02) → git-03ad60b1 원스토어(ONE Store) IAP 연동.
      #   IAP 브랜치 yang/onestore-store-enum (main 아님 — 인터널 실기기 검증용 선행 배포).
      #   Store.ONESTORE(4) + 영수증 파싱 + 원스토어 서버 검증(OAuth 토큰 → 구매 조회) +
      #     지급 뒤 acknowledge 가 들어 있다.
      #   ⚠️ 이 이미지만 올려도 **기존 결제 경로는 무영향**이다. 원스토어 경로는
      #     API_ONESTORE_* 가 비어 있으면 검증기가 "not configured" 로 거절한다(fail-closed).
      #     실제로 켜려면 셋이 다 필요하다:
      #       1. AWS 시크릿 iap-env 에 onestore-client-id / -client-secret / -host
      #          (인터널 host = https://sbpp.onestore.net, 검증환경)
      #       2. 차트에 API_ONESTORE_* env 주입 — PR #3592 (iap-api 는 키마다 secretKeyRef
      #          를 명시하는 구조라 시크릿만 채워선 주입되지 않는다)
      #       3. **alembic a5f3c8d21b7e** — PG enum `store` 에 ONESTORE 라벨 추가.
      #          ✅ 2026-09-02 적용 완료. 9c1e2f3a4b5c → c1a7f0d3b9e4 → 0eb7c95c9f30 →
      #          d2f4a1c6e8b3 → a5f3c8d21b7e. store 라벨에 ONESTORE 확인, purchase_signal
      #          생성(0행, 아직 쓰는 코드 없음 — IAP#478), INVALID 인덱스 잔여 없음.
      #          1·2 도 적용 완료(시크릿 version 7ce103c4, 차트는 #3592).
      tag: "git-03ad60b1f4e54e469b3b5af9cc53b4db8381b7e7"
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-internal-v2-seasonpass-worker"

  worker:
    enabled: true
    stage: "internal"
    image:
      # 복권 브랜치 핀(b51e4a4a) 해제 → main HEAD. 그 브랜치의 복권 커밋은 #476 로 main 에
      #   머지됐고, 핀 커밋 자체는 리베이스로 사라진 pre-review 판이었다(backup 브랜치에만 존재).
      #   라이브는 beat/product-worker=b51e4a4a, background-job-worker=89de9a3 으로 갈려 있었다 —
      #   이 커밋으로 셋 다 main 으로 수렴한다.
      #
      # (2026-08-26) api 와 같은 커밋으로 정렬. 워커에서 실제로 달라지는 것:
      #   1. enroll 이 비IAP 상품을 제외한다(#484). 인터널의 유일한 active 매핑이 FREE 상품
      #      (product 111)이라 **발급이 멈추고**, 매 회차 경고 로그가 남는다:
      #        "active voucher mapping on non-IAP product — enroll 제외됨"
      #      복권 e2e 를 계속하려면 비활성 IAP 매핑(product 3/5/6) 중 하나를 켜야 한다.
      #      active=true 는 실발급 트리거라 사람이 판단해 켤 것 — 이 PR 은 켜지 않는다.
      #   2. 스테이지 게이트가 in ("production","mainnet") 으로 바뀐다(#486). 인터널은
      #      stage="internal" 이라 전후 동일(TEST 스토어 포함). 대신 stage 가 기본값이 아니므로
      #      샌드박스 경고가 WARNING 이 아니라 INFO 로 찍힌다 — 단, 이 stage 값은 아직
      #      **워커에 주입되지 않는다**(WORKER_STAGE env 미배선, 9c-infra#3566). 배선 전까지
      #      워커는 config.stage 기본값 "development" 로 동작하고 WARNING 이 찍힌다.
      #
      # (2026-08-31) → git-769e601c (IAP#490) 시즌패스 구매에 바우처가 발급되지 않던 문제.
      #   시즌패스는 send_product 큐를 타지 않아(purchase.py 가 season_pass_host 를 직접 호출)
      #     tx_status 가 영구히 NULL 인데, enroll·dispatch 가 tx_status == SUCCESS 를 요구해
      #     **매핑이 켜져 있어도 아웃박스가 아예 생기지 않았다**(제보 주소의 3건 실측).
      #     마일리지는 purchase.py 안에서 동기로 주므로 같은 영수증에서 정상 지급됐다.
      #   예외는 **"tx 가 없고 실패 기록(msg)도 없는"** 시즌패스 건으로만 좁혔다 — 상품만 보면
      #     패스 지급이 실패한 영수증까지 발급된다(mainnet 실측 75건). 그 경로에선 마일리지도
      #     안 나가므로 msg 게이트가 없으면 마일리지 선례보다 관대해진다.
      #   retryer 의 하드코딩 사본(`NOT LIKE '%pass%'`)도 공용 토큰으로 통일했다 — 토큰이 바뀌면
      #     시즌패스가 send_product 로 재전송돼 패스와 온체인 아이템이 이중 지급되는 자리다.
      #
      #   ⚠️ 배포 직후 인터널에서 시즌패스 3건이 발급된다. voucher-grant-cutoff 를
      #      2026-08-31T00:00:00Z 로 올려뒀기 때문(원래 2026-08-05 였고 그때 기준이면 12건).
      #
      # (2026-09-02) → git-03ad60b1 api 와 같은 커밋으로 정렬. 워커에서 달라지는 것은
      #   바우처 스토어 집합에 ONESTORE 가 들어간 것 하나뿐이다 —
      #   _PROD_STORES / _MOBILE_STORES 에 추가되어 platform_for_store(ONESTORE)="MOBILE".
      #   원스토어 영수증이 아직 없으니 실동작 변화는 없다. 환불 회수(_GOOGLE_STORES)는
      #   일부러 안 건드렸다 — google void 폴링 전용 자리라 넓히면 오매칭이 난다.
      #   원스토어 환불 회수는 별도 폴링이 필요하고 그 전까지 수동이다.
      tag: "git-03ad60b1f4e54e469b3b5af9cc53b4db8381b7e7"
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-internal-v2-iap-worker"
