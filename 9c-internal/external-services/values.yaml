clusterName: 9c-internal
provider: RKE2

externalSecret:
  enabled: true
  provider: AWS
  prefix: "9c-internal-v2/external-services"

gateway:
  enabled: true
  services:
  - name: seasonpass-api-service
    hostnames:
    - seasonpass-internal.9c.gg
  - name: iap-backoffice
    hostnames:
    - iap-internal-backoffice.9c.gg
  - name: iap-api
    hostnames:
    - iap-internal-api.9c.gg

volumeReclaimPolicy: "Retain"

seasonpass:
  enabled: true
  image:
    tag: "git-3c29100ff62f588ecf14dd50e48527c55bb02fe3"

  api:
    enabled: true
    stage: "internal"
    resources:
      limits:
        cpu: 0.5
        memory: 1Gi

    # /ping is a sync FastAPI route that runs in the same threadpool as
    # request handlers, so it queues when the threadpool is exhausted by
    # blocked GQL calls — exactly the hang signature we want to detect.
    livenessProbe:
      httpGet:
        path: /ping
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ping
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  worker:
    enabled: true
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-internal-v2-seasonpass-worker"
    flower:
      enabled: true
    resources:
      limits:
        cpu: 0.5
        memory: 1Gi

  tracker:
    enabled: true

    odin:
      planetId: "0x100000000000"
    heimdall:
      planetId: "0x100000000001"
    thor:
      planetId: "0x100000000003"

    resources:
      limits:
        cpu: 0.5
        memory: 1Gi

iap:
  enabled: true
  backoffice:
    enabled: false
    image:
      tag: "git-9321af4246edb846db69a2c43df63cfbad5cfa16"


  api:
    enabled: true
    stage: "internal"
    image:
      # NineChronicles.IAP#481 (yang/purchase-prev-receipt-guard) 검증용.
      #   /purchase/request 의 멱등 조기반환에 "INVALID 영수증은 200으로 돌려주지
      #   않는" 가드를 넣었다. 200을 주면 클라가 결제를 confirm(= consume +
      #   acknowledge)해 스토어 자동환불이 사라진다.
      # PR 머지 전 브랜치 빌드 이미지다 — 검증 후 main 이미지로 교체할 것.
      # 검증: 인터널 테스트 결제 -> track_tx 한 바퀴(1분+) 대기
      #   -> 같은 영수증으로 /purchase/request 재전송해서 200 인지 확인.
      #   400 이면 가드가 지급 완료 건을 거절하는 것이므로 즉시 롤백.
      tag: "git-476b4bd183a84575b95e4b53841bc329b6519103"
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-internal-v2-seasonpass-worker"

  worker:
    enabled: true
    stage: "internal"
    image:
      tag: "git-b51e4a4abf152a9b7aaff480b7a8e3e0891b240f" # (복권 테스트) yang/voucher-lottery-refactor. 검증 후 복구
    serviceAccount:
      roleArn: "arn:aws:iam::319679068466:role/9c-internal-v2-iap-worker"
