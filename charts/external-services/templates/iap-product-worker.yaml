{{- if $.Values.iap.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: iap-product-worker
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: iap-product-worker
  namespace: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iap-product-worker
  template:
    metadata:
      labels:
        app: iap-product-worker
    spec:
      containers:
        - name: iap-product-worker
          args:
            - celery -A app.celery_app worker --loglevel=info -Q product_queue --concurrency=1 -n product_worker@%h
          command:
            - /bin/sh
            - -c
          env:
            # (2026-08-26) 워커에 stage 를 실제로 주입한다. 이 env 가 없어서 워커의
            #   config.stage 가 기본값 "development" 로 굳어 있었고, values 의
            #   iap.worker.stage 는 템플릿이 읽지 않는 **죽은 값**이었다.
            #   영향: 바우처 발급 대상 스토어 게이트(_grantable_stores)가 non-production 에서
            #   TEST 스토어까지 포함하므로, 메인넷에서 바우처를 켜면 샌드박스 영수증이 실제
            #   NCG 바우처를 발급한다. api 는 API_STAGE 를 이미 이렇게 넣고 있다(iap-api.yaml).
            #   ⚠️ 이 env 만으로는 안 닫힌다 — 코드가 `stage == "production"` 만 보므로
            #   `in ("production","mainnet")` 로 고치는 IAP 변경(NineChronicles.IAP#485)이 함께 필요하다.
            - name: WORKER_STAGE
              value: {{ $.Values.iap.worker.stage }}
            - name: WORKER_KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: kms-key-id
                  name: iap-env
            - name: WORKER_REGION_NAME
              valueFrom:
                secretKeyRef:
                  key: region
                  name: iap-env
            - name: WORKER_GQL_URL_MAP
              valueFrom:
                secretKeyRef:
                  key: gql-url-dict
                  name: iap-env
            - name: WORKER_PG_DSN
              valueFrom:
                secretKeyRef:
                  key: db-uri
                  name: iap-env
            - name: WORKER_BROKER_URL
              valueFrom:
                secretKeyRef:
                  key: rmq-url
                  name: iap-env
            - name: WORKER_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  key: redis-url
                  name: iap-env
            - name: WORKER_HEADLESS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: headless-jwt-token
                  name: iap-env
          image: {{ $.Values.iap.worker.image.repository }}:{{ $.Values.iap.worker.image.tag }}
          {{- with $.Values.iap.worker.resources }}
          resources:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          name: iap-product-worker
      {{- with $.Values.iap.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      serviceAccount: {{ $.Release.Name }}-iap-iam-role
      serviceAccountName: {{ $.Release.Name }}-iap-iam-role
{{- end }}
