{{- if $.Values.iap.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: iap-beat
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: iap-beat
  namespace: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iap-beat
  template:
    metadata:
      labels:
        app: iap-beat
    spec:
      containers:
        - name: iap-beat
          args:
            - celery -A app.celery_app beat --loglevel=info
          command:
            - /bin/sh
            - -c
          env:
            # (2026-08-26) 워커에 stage 를 실제로 주입한다. 이 env 가 없어서 워커의
            #   config.stage 가 기본값 "development" 로 굳어 있었고, values 의
            #   iap.worker.stage 는 템플릿이 읽지 않는 **죽은 값**이었다.
            #   영향: 바우처 발급 대상 스토어 게이트(_grantable_stores)가 non-production 에서
            #   TEST 스토어까지 포함하므로, 메인넷에서 바우처를 켜면 샌드박스 영수증이 실제
            #   NCG 바우처를 발급한다. api 는 API_STAGE 를 이미 이렇게 넣고 있다(iap-api.yaml).
            #   ⚠️ 이 env 만으로는 안 닫힌다 — 코드가 `stage == "production"` 만 보므로
            #   `in ("production","mainnet")` 로 고치는 IAP 변경(NineChronicles.IAP#486)이 함께 필요하다 —
            #   이건 main 에 머지됐고 이미지 git-26840df4 에 들어 있다. 즉 메인넷은 이 env 주입 +
            #   9c-main/external-services 의 워커 태그 bump 가 **둘 다** 돼야 게이트가 닫힌다.
            - name: WORKER_STAGE
              value: {{ $.Values.iap.worker.stage }}
            - name: WORKER_KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: kms-key-id
                  name: iap-env
            - name: WORKER_REGION_NAME
              valueFrom:
                secretKeyRef:
                  key: region
                  name: iap-env
            - name: WORKER_GQL_URL_MAP
              valueFrom:
                secretKeyRef:
                  key: gql-url-dict
                  name: iap-env
            - name: WORKER_PG_DSN
              valueFrom:
                secretKeyRef:
                  key: db-uri
                  name: iap-env
            - name: WORKER_BROKER_URL
              valueFrom:
                secretKeyRef:
                  key: rmq-url
                  name: iap-env
            - name: WORKER_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  key: redis-url
                  name: iap-env
            - name: WORKER_HEADLESS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: headless-jwt-token
                  name: iap-env
          image: {{ $.Values.iap.worker.image.repository }}:{{ $.Values.iap.worker.image.tag }}
          {{- with $.Values.iap.worker.resources }}
          resources:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          name: iap-beat
          # (2026-09-29) celery beat 은 헬스 엔드포인트가 없어 "살아있는데 멈춘" 상태를
          #   k8s 가 못 본다. 실제로 iap-beat 이 4시간 20분, seasonpass-beat 이 2일 18시간을
          #   Running 1/1 · 재시작 0회 상태로 멈춰 있었다(Redis PubSub 재진입 데드락).
          #   그동안 주기 작업이 전부 섰고, 알람 태스크까지 같이 죽어 아무도 몰랐다.
          #
          #   살아있음 신호로 PersistentScheduler 의 스케줄 파일 mtime 을 쓴다. beat 은
          #   Scheduler.sync_every(180초)를 넘겼을 때 tick 에서 이 파일을 다시 쓴다.
          #   ⚠️ 갱신 간격은 180초로 고정이 아니다 — beat 은 다음 due 태스크까지 자므로
          #      스케줄이 성길수록 tick 이 늦다(실측: iap 141초, seasonpass 245초).
          #      그래서 임계값을 900초로 넉넉히 잡았다. 앱 쪽에 beat_max_loop_interval=60 을
          #      넣는 변경이 따로 올라가 있으니(IAP/SeasonPass 저장소), **그 이미지가 배포된 뒤**
          #      420초까지 줄일 수 있다. 순서가 뒤집히면 probe 가 멀쩡한 beat 을 죽인다.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, sys, time
                  sys.exit(
                      0
                      if time.time() - os.path.getmtime("/app/apps/worker/celerybeat-schedule") < 900
                      else 1
                  )
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      {{- with $.Values.iap.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      serviceAccount: {{ $.Release.Name }}-iap-iam-role
      serviceAccountName: {{ $.Release.Name }}-iap-iam-role
{{- end }}
