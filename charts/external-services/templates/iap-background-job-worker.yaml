{{- if $.Values.iap.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: iap-background-job-worker
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: iap-background-job-worker
  namespace: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iap-background-job-worker
  template:
    metadata:
      labels:
        app: iap-background-job-worker
    spec:
      containers:
        - name: iap-background-job-worker
          args:
            - celery -A app.celery_app worker --loglevel=info -Q background_job_queue --concurrency=1 -n background_job_worker@%h
          command:
            - /bin/sh
            - -c
          env:
            # (2026-08-26) 워커에 stage 를 실제로 주입한다. 이 env 가 없어서 워커의
            #   config.stage 가 기본값 "development" 로 굳어 있었고, values 의
            #   iap.worker.stage 는 템플릿이 읽지 않는 **죽은 값**이었다.
            #   영향: 바우처 발급 대상 스토어 게이트(_grantable_stores)가 non-production 에서
            #   TEST 스토어까지 포함하므로, 메인넷에서 바우처를 켜면 샌드박스 영수증이 실제
            #   NCG 바우처를 발급한다. api 는 API_STAGE 를 이미 이렇게 넣고 있다(iap-api.yaml).
            #   ⚠️ 이 env 만으로는 안 닫힌다 — 코드가 `stage == "production"` 만 보므로
            #   `in ("production","mainnet")` 로 고치는 IAP 변경(NineChronicles.IAP#486)이 함께 필요하다 —
            #   이건 main 에 머지됐고 이미지 git-26840df4 에 들어 있다. 즉 메인넷은 이 env 주입 +
            #   9c-main/external-services 의 워커 태그 bump 가 **둘 다** 돼야 게이트가 닫힌다.
            - name: WORKER_STAGE
              value: {{ $.Values.iap.worker.stage }}
            - name: WORKER_KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: kms-key-id
                  name: iap-env
            - name: WORKER_REGION_NAME
              valueFrom:
                secretKeyRef:
                  key: region
                  name: iap-env
            - name: WORKER_GQL_URL_MAP
              valueFrom:
                secretKeyRef:
                  key: gql-url-dict
                  name: iap-env
            - name: WORKER_PG_DSN
              valueFrom:
                secretKeyRef:
                  key: db-uri
                  name: iap-env
            - name: WORKER_BROKER_URL
              valueFrom:
                secretKeyRef:
                  key: rmq-url
                  name: iap-env
            - name: WORKER_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  key: redis-url
                  name: iap-env
            - name: WORKER_IAP_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  key: iap-alert-webhook-url
                  name: iap-env
            - name: WORKER_IAP_GARAGE_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  key: iap-garage-webhook-url
                  name: iap-env
            - name: WORKER_HEADLESS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: headless-jwt-token
                  name: iap-env
            - name: WORKER_GOOGLE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  key: google-credential
                  name: iap-env
            - name: WORKER_IAP_SALES_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  key: iap-sales-webhook-url
                  name: iap-env
            # (PLD-1469/1472) NCG Voucher 발급/회수 트리거. optional=true → 키 없는 env(예: prod)에선
            #   미주입 → config 기본값(voucher_grant_enabled=False)로 비활성. 인터널 iap-env에 키 세팅 시 활성.
            - name: WORKER_VOUCHER_GRANT_ENABLED
              valueFrom:
                secretKeyRef:
                  key: voucher-grant-enabled
                  name: iap-env
                  optional: true
            - name: WORKER_PORTAL_GRANT_URL
              valueFrom:
                secretKeyRef:
                  key: portal-grant-url
                  name: iap-env
                  optional: true
            - name: WORKER_PORTAL_REVOKE_URL
              valueFrom:
                secretKeyRef:
                  key: portal-revoke-url
                  name: iap-env
                  optional: true
            - name: WORKER_PORTAL_IAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: portal-iap-jwt-secret
                  name: iap-env
                  optional: true
            - name: WORKER_VOUCHER_GRANT_CUTOFF
              valueFrom:
                secretKeyRef:
                  key: voucher-grant-cutoff
                  name: iap-env
                  optional: true
          image: {{ $.Values.iap.worker.image.repository }}:{{ $.Values.iap.worker.image.tag }}
          {{- with $.Values.iap.worker.resources }}
          resources:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          name: iap-background-job-worker
      {{- with $.Values.iap.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      serviceAccount: {{ $.Release.Name }}-iap-iam-role
      serviceAccountName: {{ $.Release.Name }}-iap-iam-role
{{- end }}
