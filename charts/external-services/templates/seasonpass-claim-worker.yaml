{{- if $.Values.seasonpass.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seasonpass-claim-worker
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: seasonpass-claim-worker
  namespace: {{ $.Release.Name }}
spec:
  replicas: 1
  # 지급 워커는 서명 키 하나로 플래닛별 nonce 를 매긴다. RollingUpdate 는 옛·새 파드가 잠시 같이
  #   떠서 같은 claim·같은 nonce 를 동시에 처리할 수 있다 — 옛 파드를 먼저 내린다.
  #   새 파드가 못 뜨면 지급이 멈추므로(메시지는 큐에 남음) 배포 때 rollout status 를 지켜본다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seasonpass-claim-worker
  template:
    metadata:
      labels:
        app: seasonpass-claim-worker
    spec:
      # SIGTERM 뒤 celery 가 하던 작업(beat 의 retry_claim 은 120초 뒤 새 건을 시작하지 않아 최악 약 150초)을
      #   마치고 내려가게 한다.
      #   메인넷 claim_timing(2026-11-18, 2609건): 건당 p50 0.39초·p99 1.6초·최대 5초.
      #   할 일이 없으면 바로 내려가므로 평소 배포가 이만큼 길어지지는 않는다.
      terminationGracePeriodSeconds: 180
      containers:
        - name: seasonpass-claim-worker
          # exec: 없으면 sh(dash 0.5.12)가 PID 1 로 남아 SIGTERM 을 무시하고, celery 는 신호를 못 받은
          #   채 유예가 끝나면 SIGKILL 된다(유예를 늘려도 기다리기만 한다).
          args:
            - exec celery -A app.celery_app worker --loglevel=info -Q claim_queue --concurrency=1 -n claim_worker@%h
          command:
            - /bin/sh
            - -c
          env:
            - name: WORKER_KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: kms-key-id
                  name: seasonpass-env
            - name: WORKER_REGION_NAME
              valueFrom:
                secretKeyRef:
                  key: region
                  name: seasonpass-env
            - name: WORKER_GQL_URL_MAP
              valueFrom:
                secretKeyRef:
                  key: gql-url-dict
                  name: seasonpass-env
            - name: WORKER_PG_DSN
              valueFrom:
                secretKeyRef:
                  key: db-uri
                  name: seasonpass-env
            - name: WORKER_BROKER_URL
              valueFrom:
                secretKeyRef:
                  key: rmq-url
                  name: seasonpass-env
            - name: WORKER_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  key: redis-url
                  name: seasonpass-env
            - name: WORKER_HEADLESS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: headless-jwt-token
                  name: seasonpass-env
            {{- /* 비밀값이 아닌 설정(재서명 WORKER_RESIGN_* 등). 환경 values 에서만 넣는다. */}}
            {{- with $.Values.seasonpass.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          image: {{ $.Values.seasonpass.worker.image.repository }}:{{ $.Values.seasonpass.image.tag }}
          {{- with $.Values.seasonpass.worker.resources }}
          resources:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          name: seasonpass-claim-worker
      {{- with $.Values.seasonpass.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      serviceAccount: {{ $.Release.Name }}-seasonpass-iam-role
      serviceAccountName: {{ $.Release.Name }}-seasonpass-iam-role
{{- end }}
