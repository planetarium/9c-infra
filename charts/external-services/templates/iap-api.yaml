{{- if $.Values.iap.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: iap-api
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: iap-api
  namespace: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iap-api
  template:
    metadata:
      labels:
        app: iap-api
    spec:
      containers:
        - name: iap-api
          env:
            - name: API_GQL_URL_MAP
              valueFrom:
                secretKeyRef:
                  key: gql-url-dict
                  name: iap-env
            - name: API_CDN_HOST_MAP
              valueFrom:
                secretKeyRef:
                  key: cdn-url-dict
                  name: iap-env
            - name: API_PG_DSN
              valueFrom:
                secretKeyRef:
                  key: db-uri
                  name: iap-env
            - name: API_GOOGLE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  key: google-credential
                  name: iap-env
            - name: API_APPLE_BUNDLE_ID
              valueFrom:
                secretKeyRef:
                  key: apple-bundle-id
                  name: iap-env
            - name: API_APPLE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  key: apple-credential
                  name: iap-env
            - name: API_APPLE_VALIDATION_URL
              valueFrom:
                secretKeyRef:
                  key: apple-validation-url
                  name: iap-env
            - name: API_APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: apple-key-id
                  name: iap-env
            - name: API_APPLE_ISSUER_ID
              valueFrom:
                secretKeyRef:
                  key: apple-issuer-id
                  name: iap-env
            - name: API_BROKER_URL
              valueFrom:
                secretKeyRef:
                  key: rmq-url
                  name: iap-env
            - name: API_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  key: redis-url
                  name: iap-env
            - name: API_HEADLESS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: headless-jwt-token
                  name: iap-env
            - name: API_SEASON_PASS_HOST
              valueFrom:
                secretKeyRef:
                  key: seasonpass-host
                  name: iap-env
            - name: API_SEASON_PASS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: seasonpass-jwt-token
                  name: iap-env
            - name: API_BACKOFFICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: backoffice-jwt-token
                  name: iap-env
            - name: API_CLOUDFLARE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: cloudflare-api-key
                  name: iap-env
            - name: API_CLOUDFLARE_ASSETS_K_ZONE_ID
              valueFrom:
                secretKeyRef:
                  key: cloudflare-assets-k-zone-id
                  name: iap-env
            - name: API_CLOUDFLARE_ASSETS_ZONE_ID
              valueFrom:
                secretKeyRef:
                  key: cloudflare-assets-zone-id
                  name: iap-env
            - name: API_CLOUDFLARE_EMAIL
              valueFrom:
                secretKeyRef:
                  key: cloudflare-email
                  name: iap-env
            - name: API_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: r2-access-key-id
                  name: iap-env
            - name: API_R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  key: r2-account-id
                  name: iap-env
            - name: API_R2_BUCKET
              valueFrom:
                secretKeyRef:
                  key: r2-bucket
                  name: iap-env
            - name: API_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: r2-secret-access-key
                  name: iap-env
            - name: API_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  key: s3-bucket
                  name: iap-env
            - name: API_CLOUDFRONT_DISTRIBUTION_1
              valueFrom:
                secretKeyRef:
                  key: cloudfront-distribution-1
                  name: iap-env
            - name: API_CLOUDFRONT_DISTRIBUTION_2
              valueFrom:
                secretKeyRef:
                  key: cloudfront-distribution-2
                  name: iap-env
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_STAGE
              value: {{ $.Values.iap.api.stage }}
            - name: API_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: stripe-secret-key
                  name: iap-env
            - name: API_STRIPE_TEST_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: stripe-test-secret-key
                  name: iap-env
            - name: API_REDEEM_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  key: redeem-api-base-url
                  name: iap-env
            - name: API_JWT_SECRET_9C
              valueFrom:
                secretKeyRef:
                  key: jwt-secret-9c
                  name: iap-env
            # (PLD-1472) 바우처 상품매핑 admin — C1(정책 크로스read)/C3-lite(cap). optional=true →
            #   키 없는 env(예: prod)에선 미주입 → config 기본 None(portal_prize_tables_url None이면
            #   admin 매핑 저장이 503으로 fail-closed, cap None이면 C3-lite 스킵). 인터널 iap-env에 키 세팅 시 활성.
            - name: API_PORTAL_PRIZE_TABLES_URL
              valueFrom:
                secretKeyRef:
                  key: portal-prize-tables-url
                  name: iap-env
                  optional: true
            - name: API_VOUCHER_GRANT_MAX_NCG_PER_GRANT
              valueFrom:
                secretKeyRef:
                  key: voucher-grant-max-ncg-per-grant
                  name: iap-env
                  optional: true
            # 원스토어(ONE Store) 구매 검증. optional=true → 키 없는 환경에선 미주입 →
            #   config 기본 None → 검증기가 "not configured" 로 **거절**한다(fail-closed).
            #   즉 메인넷 iap-env 에 키를 넣기 전까지 메인넷 동작은 지금과 동일하다.
            #   host 는 배포별로 갈린다 — 인터널 https://sbpp.onestore.net (검증환경),
            #   메인넷 https://iap-apis.onestore.net (상용). client-id/secret 은 앱 단위
            #   한 벌이라 양쪽이 같은 값이다(개발자센터 > 공통정보 > 라이선스 관리).
            - name: API_ONESTORE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: onestore-client-id
                  name: iap-env
                  optional: true
            - name: API_ONESTORE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: onestore-client-secret
                  name: iap-env
                  optional: true
            - name: API_ONESTORE_HOST
              valueFrom:
                secretKeyRef:
                  key: onestore-host
                  name: iap-env
                  optional: true
            # 마켓 구분 코드. 코드 기본값이 MKT_GLB(글로벌 배포) 라 평소엔 키가 없어도 된다.
            #   배포국가가 한국이면 MKT_ONE 으로 덮어야 한다 — 이 헤더가 틀리면 원스토어가
            #   다른 마켓에서 조회해서 **모든 구매가 NoSuchData(없는 구매)로 보인다**.
            - name: API_ONESTORE_MARKET_CODE
              valueFrom:
                secretKeyRef:
                  key: onestore-market-code
                  name: iap-env
                  optional: true
          image: {{ $.Values.iap.api.image.repository }}:{{ $.Values.iap.api.image.tag }}
          {{- with $.Values.iap.api.resources }}
          resources:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          ports:
            - containerPort: 8000
          name: iap-api
      {{- with $.Values.iap.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      serviceAccount: {{ $.Release.Name }}-iap-iam-role
      serviceAccountName: {{ $.Release.Name }}-iap-iam-role
{{- end }}
