server:
  enabled: false
  replicas: 1
  image:
    repository: ""
    tag: ""

backoffice:
  enabled: false
  image:
    repository: ""
    tag: ""

workers:
  image:
    repository: ""
    tag: ""
  rankingWorker:
    enabled: false
    schedule: "0 * * * *"
    command: "ranking"
  blockResetWorker:
    enabled: false
    schedule: "0 0 * * *"
    command: "reset"
  walletMonitorWorker:
    enabled: false
    schedule: "0 0 * * *"
    command: "wallet"
  # 무인 시즌 전환(A: 종료 지급). nodeSelector 가 비면 workers.nodeSelector 를 쓴다.
  seasonAutomation:
    enabled: false
    schedule: "*/10 * * * *"
    command: "season-automation"
    nodeSelector: {}
