{{- if and .Values.backofficeService.externalSecret.enabled .Values.backofficeService.opsAgentJwt.enabled }}
# 동글이 옵스 ops JWT 서명 키(OPS_AGENT_JWT_SECRET) 하나만 담은 secret.
# 백오피스 자체는 {{ .Release.Name }}-backoffice-secrets(전체 env)로 이 키를 받는다. 이 secret 은 동글이 옵스 래퍼(ops-portal)가
# 읽기 위한 것 — 백오피스 secret 전체(DB·KMS 등)를 래퍼에 열지 않으려고 따로 둔다(9c-main/values.yaml donggeulOps.secretReads).
# 계약: 9c-portal apps/backoffice/docs/ops-agent-auth.md
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-backoffice-ops-jwt
  namespace: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: backoffice
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Release.Name }}-backoffice-secret-store
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-backoffice-ops-jwt
    creationPolicy: Owner
  data:
    - secretKey: OPS_AGENT_JWT_SECRET
      remoteRef:
        key: {{ .Values.backofficeService.externalSecret.prefix }}/env
        property: OPS_AGENT_JWT_SECRET
{{- end }}
