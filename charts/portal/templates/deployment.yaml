apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    component: portal
  namespace: {{ .Release.Name }}
spec:
  replicas: {{ .Values.portalService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: portal
    spec:
      {{- if .Values.migrate.enabled }}
      # (PLD-1401) DB 마이그레이션 — 앱 컨테이너 시작 '전에' initContainer로 prisma migrate deploy 1회.
      #   migrator 이미지(prisma CLI + schema + migrations 포함). DATABASE_URL은 {{ .Release.Name }}-secrets에서 주입.
      #   실패 시 pod가 Init에서 멈춰 새 pod가 Ready 안 됨 → rollingUpdate가 옛 pod 유지(잘못된 마이그레이션 배포 차단).
      #   공유 DB라 포탈 하나에만 둠(백오피스까지 커버). 적용할 게 없으면 no-op으로 즉시 통과. advisory lock으로 동시성 안전.
      initContainers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag | default .Values.portalService.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy | default "Always" }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.portalService.name }}
          image: "{{ .Values.portalService.image.repository }}:{{ .Values.portalService.image.tag }}"
          imagePullPolicy: {{ .Values.portalService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.portalService.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          {{- if .Values.portalService.cronjobs }}
          # (PLD-1563) 스케줄러 CronJob 이 보내는 `x-api-key` 를 포탈이 검증하려면 같은 값이
          #   앱에도 있어야 한다. 새 시크릿을 만들지 않고 **백오피스 시크릿의 기존 키를
          #   같은 네임스페이스에서 재사용**한다 — 두 앱의 스케줄러 호출자는 같은 신뢰
          #   수준(클러스터 내부 CronJob)이라 키를 나눌 이유가 없고, 나누면 AWS 시크릿을
          #   하나 더 관리해야 한다.
          #   ⚠️ optional=true 다. 키가 없는 환경에서도 파드는 떠야 하고, 그때 스케줄러
          #      엔드포인트는 앱에서 503 으로 fail-closed 한다(portal lib/apiHandler.ts).
          env:
            - name: SCHEDULER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backoffice-secrets
                  key: SCHEDULER_API_KEY
                  optional: true
          {{- end }}
          resources:
            {{- toYaml .Values.portalService.resources | nindent 12 }}
      {{- with .Values.portalService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
