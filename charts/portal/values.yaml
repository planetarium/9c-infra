portalService:
  name: portal
  hostname: "localhost"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 2
      memory: 3Gi
    requests:
      cpu: 1
      memory: 1.5Gi
  nodeSelector: {}
  image:
    repository: planetariumhq/9c-portal
    tag: "internal-latest"
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-internal-v2/portal"
  env:
    ETH_JSON_RPC_PROVIDER_URL: "https://mainnet.infura.io/v3/9b981bb164114a8b882d6c6c6c8d9fc1"
    TWITTER_ID: "1155834450787233792"
    IR2_TWITTER_ID: "1752251826886553600"
    JC_TWITTER_ID: "709049309237346304"
    V8_TWITTER_ID: "1689881443118563328"
    MINIMUM_BALANCE_TO_WITHDRAW: 5
    NC_ADDRESS_NCG_MINTER: 47d082a115c63e7b58b1532d20e631538eafadde
    NC_ADDRESS_PORTAL: "0x491d9842ed8f1b5d291272cf9e7b66a7b7c90cda"
    NC_ADDRESS_NCG_VOUCHER: "0xc1Ea0D238f7b1C9c70Ce6589DAb2F15C1A076455"
    PLANET_VAULT_ADDRESS: "0x1c2ae97380CFB4F732049e454F6D9A25D4967c6f"
    BACKEND_ROLE_ARN: "arn:aws:iam::319679068466:role/9c-portal-kms"
    KMS_REGION: us-east-2
    KMS_MEAD_REGION: us-east-2
    KMS_NCG_VOUCHER_REGION: us-east-2
    DISCORD_SERVER_ID: "1069427717130440794"
    DISCORD_IR2_SERVER_ID: "1222423353936183359"
    AUTH_COOKIE_NAME: accessToken
    S3_REGION: us-east-2
    MAINNET_ODIN: "https://9c-main-jwt.nine-chronicles.com/graphql"
    MAINNET_HEIMDALL: "https://heimdall-jwt.nine-chronicles.com/graphql"
backofficeService:
  name: backoffice
  hostname: "localhost"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  resources:
    limits:
      cpu: 2
      memory: 3Gi
    requests:
      cpu: 1
      memory: 1.5Gi
  nodeSelector: {}
  image:
    repository: planetariumhq/9c-portal-backoffice
    tag: "internal-latest"
    pullPolicy: Always
  externalSecret:
    enabled: true
    provider: AWS
    prefix: "9c-internal-v2/backoffice"
  cronjobs:

# (PLD-1401) DB 마이그레이션 자동화 — 포탈 Deployment의 initContainer로 prisma migrate deploy 1회.
#   기본 off → 오버레이에서 opt-in. 프로드는 돈-인접이라 기본 off 권장(수동 게이트 유지).
#   인터널은 migrator 이미지가 internal-latest에 존재하게 된 뒤(모노레포+migrator develop 머지 후) enabled:true.
#   nodeSelector는 pod(portalService)를 따름 — initContainer 별도 지정 불필요.
#   image.tag는 지정 안 하면 portalService.image.tag를 그대로 따라감(prod=핀 sha, internal=internal-latest).
#   → 앱↔migrator 태그 드리프트 원천 차단. 굳이 다르게 쓰려면 여기 tag를 명시.
#   (전제: migrator 이미지가 portal과 같은 sha로 빌드됨 — build-push.yml의 build-migrator가 portal과 동일 조건.)
migrate:
  enabled: false
  image:
    repository: planetariumhq/9c-portal-migrator
    pullPolicy: Always
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# 포탈 지급용 핫월렛(출금/리워드·바우처·MEAD) 잔고 일일 리포트 → Slack.
#   온체인 GraphQL read + chat.postMessage만 하는 CronJob. 서명/전송 경로는 호출하지 않는다.
#   Slack 봇 토큰은 백오피스 시크릿의 SLACK_TOKEN 재사용(별도 시크릿 추가 불필요).
#   기본 off → 오버레이에서 opt-in. 인터널은 prod와 주소·체인이 같아 리포트가 중복이므로 켜지 않는다.
#   warnNcg/warnMead를 0보다 크게 주면 그 아래일 때 해당 값에 :warning: 가 붙는다(0=표시만).
walletBalanceReport:
  enabled: false
  schedule: "0 1 * * *" # 01:00 UTC = 10:00 KST
  image: python:3.12-alpine
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  # odin-rpc-1 을 쓰지 말 것 — nginx 경유 remote-headless-1 단일 매핑(StreamingHub sticky)
  # 이라 rh-1 이 내려가면 백업 upstream 없이 502 가 된다. 2026-09-26 실제로 이 리포트가
  # "조회 실패" 로 나갔다. odin-gql 은 upstream 이 [rh-1, validator-5] 라 한쪽이 죽어도
  # 살아남고, 복구되면 자동으로 다시 분산된다.
  gqlEndpoint: "https://odin-gql.nine-chronicles.com/graphql"
  # [{label, address, assets: [NCG|MEAD], warnNcg, warnMead}] — 오버레이에서 채운다.
  wallets: []

# 출금 적체 감시 → Slack. 2026-09-21 출금 스케줄러가 7일간 멈췄는데 아무도 모른 사고의
#   재발 방지다(959건 / 132,275 NCG 정지). 감시 지표는 **가장 오래된 미지급 출금의 나이** —
#   당시 다른 지표는 전부 속았다:
#     · CronJob 성공/실패: curl 에 -f 가 없어 HTTP 400/500 이 exit 0 = Succeeded
#     · Job Active 여부: 물린 Job 이 Running 이라 "돌고 있음" 으로 보인다
#     · lastSuccessfulTime: 락 경합 400 이 반복되는 변종(크론은 성공, 지급은 0건)에 속는다
#   백오피스 이미지를 그대로 써서 런타임 의존성 설치 없이 prisma 로 읽는다(읽기 전용).
#   기본 off → 오버레이에서 opt-in.
withdrawalBacklogAlert:
  enabled: false
  # 정각을 피한다 — 출금 크론(2분 주기)과 겹치면 스테이징 구간에 물려 STAGING 오탐
  # 확률이 오른다. 주기 + 임계값이 최악의 탐지 지연(기본 3시간).
  schedule: "17 * * * *"
  slackChannel: "9c-metrics"
  envLabel: "Prod"
  # 평시 처리량이 시간당 200건대라 정상이면 몇 분을 안 넘긴다. 다만 스케줄러가
  # 유저당 run 1건이라 한 유저가 60건 넘게 쌓으면 정상이어도 2시간을 넘길 수 있다 —
  # 메시지에 "한 유저 최다 대기" 를 같이 실어 구분하게 해뒀다.
  thresholdMinutes: 120
  # 이상이 없어도 이 UTC 시각의 run 은 한 줄 남긴다(dead-man's switch).
  # 01:00 UTC = 10:00 KST — 잔고 리포트와 같은 시간대.
  heartbeatHourUtc: 1
  timeoutSeconds: 300
