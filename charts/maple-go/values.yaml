# 기본은 꺼 둔다 — 9c-main/maple-go/values.yaml 에서만 켠다
externalSecretKey: ""

imagePullSecret:
  name: maple-go-dockerhub
  secretKey: ""

nodeSelector: {}

rosterSync:
  enabled: false
  schedule: "0 0 * * 1"
  backoffLimit: 2
  # 첫 실행은 명단 전원(코디가 바뀐 사람 포함)을 굽느라 한 시간을 넘길 수 있다 — 평소 주간 실행은 새 사람만 굽는다
  activeDeadlineSeconds: 14400
  image:
    repository: planetariumhq/maple-go-roster-sync
    tag: develop
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
