apiVersion: v1
kind: Service
metadata:
  name: compat-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compat.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "compat.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
