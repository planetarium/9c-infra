apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compat-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compat.labels" . | nindent 4 }}
  annotations:
    # 앱을 지우거나 prune 해도 게임 상태 볼륨은 남긴다.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # ReadWriteOncePod: 파드 하나만 마운트 가능. ReadWriteOnce 는 "노드 하나" 제한이라
  # 파드 삭제·축출 때 Recreate 순서가 지켜지지 않으면 같은 노드의 두 파드가 같은 볼륨을
  # 동시에 마운트해 상태를 덮어쓸 수 있다. 새 파드는 기존 파드가 볼륨을 놓을 때까지 대기한다.
  accessModes: [ReadWriteOncePod]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
