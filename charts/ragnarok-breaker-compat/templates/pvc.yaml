apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compat-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compat.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
