name: Reset bridge service

on:
  workflow_dispatch:
    inputs:
      network:
        required: true
        description: 'network type'
        default: 'heimdall-internal'
        type: choice
        options:
          - heimdall-internal
  workflow_call:
    inputs:
      network:
        required: true
        type: string

jobs:
  reset-bridge-service:
    # ubuntu-latest 가 26.04 로 바뀐 뒤(2026-11) setup-python 의 3.10.13 빌드가 없어 실패한다 — 24.04 고정.
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
      with:
        version: 'v1.29.0'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Set namespace based on input
      run: |
        NETWORK="${{ inputs.network }}"
        echo "NAMESPACE=${NETWORK%"-internal"}" >> $GITHUB_ENV

    - uses: actions/setup-python@v2.2.2
      with:
        python-version: 3.10.13

    - run: |
        python -m pip install -r requirements.txt
        flit install
      name: install dependencies
      working-directory: ./scripts

    - name: Update 'bridgeService.rdb.defaultStartBlockIndex'
      run: |
        python cli.py update-bridge-service 9c-internal ${{ env.NAMESPACE }}
      working-directory: ./scripts
      env:
        GITHUB_TOKEN: ${{ secrets.P_GITHUB_TOKEN }}
