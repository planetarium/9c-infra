{{- with (.Values.pushgatewayIngress).host }}
# (2026-10-23) 클러스터 밖(pt4 동글이 옵스)에서 heartbeat 를 올리는 입구. Basic 인증 필수.
#   인증 secret `pushgateway-basic-auth`(키 users, htpasswd 형식)는 수동 생성 — 값은 커밋하지 않는다.
#   쓰는 쪽은 /metrics/job/<job> 에 PUT/POST 한다. 읽기(GET /metrics)도 같은 인증 뒤다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pushgateway-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: pushgateway-basic-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pushgateway
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-pushgateway-auth@kubernetescrd
spec:
  rules:
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-prometheus-pushgateway
                port:
                  number: 9091
{{- end }}
