{{ if .Values.loki.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: loki
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.29.0
    helm:
      values: |-
        global:
          dnsService: "rke2-coredns-rke2-coredns"

        # SingleBinary + filesystem on a Longhorn PVC (2026-10-21). The previous
        # SimpleScalable setup stored chunks in R2 and broke when the R2 token was
        # revoked (loki-write was scaled to 0 on 2026-03-25).
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            path_prefix: /var/loki
            replication_factor: 1
          {{- if $.Values.loki.metrics.enabled }}
          structuredConfig:
            ruler:
              storage:
                type: local
                local:
                  directory: /rules
              rule_path: /tmp/ruler-scratch
              wal:
                dir: /var/loki/ruler-wal
              remote_write:
                enabled: true
                clients:
                  prometheus:
                    url: "http://prometheus-server.monitoring.svc.cluster.local/api/v1/write"
          {{- end }}
          storage:
            type: filesystem
          schemaConfig:
            configs:
            - from: "2026-10-01"
              index:
                period: 24h
                prefix: loki_index_
              store: tsdb
              object_store: filesystem
              schema: v13
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
          limits_config:
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            retention_period: {{ $.Values.loki.retentionPeriod }}
            max_query_series: 100000
            max_entries_limit_per_query: 100000
            query_timeout: 300s
            ingestion_rate_mb: 32
            ingestion_burst_size_mb: 64
            per_stream_rate_limit: 8MB
            per_stream_rate_limit_burst: 16MB
          server:
            http_server_read_timeout: 300s
            http_server_write_timeout: 300s

        lokiCanary:
          enabled: false

        singleBinary:
          replicas: 1
          {{- with $.Values.loki.singleBinary.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $.Values.loki.singleBinary.resources | nindent 12 }}
          persistence:
            enabled: true
            size: {{ $.Values.loki.singleBinary.storageSize }}
            storageClass: {{ $.Values.loki.singleBinary.storageClass }}

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        test:
          enabled: false
        monitoring:
          lokiCanary:
            enabled: false
          dashboards:
            enabled: false
          rules:
            enabled: false
          alerts:
            enabled: false
          serviceMonitor:
            enabled: false
          selfMonitoring:
            enabled: false
            lokiCanary:
              enabled: false
            grafanaAgent:
              installOperator: false
        {{- if $.Values.loki.metrics.enabled }}
        ruler:
          enabled: true
          replicas: 0
          persistence:
            enabled: false

        sidecar:
          rules:
            enabled: true
            folder: /rules/fake
            label: loki_rule
            labelValue: "true"
            resource: both
            searchNamespace: ALL
        {{- else }}
        sidecar:
          rules:
            enabled: false
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
---
{{- if $.Values.loki.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
  labels:
    loki_rule: "true"
data:
  tx_eval.yaml: |
    groups:
      - name: tx_eval
        interval: 30s
        rules:
          - record: action_duration_ms_avg1m
            expr: |
              avg_over_time({subtag="TxEvaluationDuration", tag="Metric"} |= `ActionEvaluator` | json action="ActionTypes[1]", duration="DurationMs" | unwrap duration [1m])
      - name: tx_count
        interval: 30s
        rules:
          - record: action_count_avg1m
            expr: |
              count_over_time({subtag="TxEvaluationDuration", tag="Metric"} |= `ActionEvaluator` | json action="ActionTypes[1]" [1m])

{{- end }}
{{ end }}
