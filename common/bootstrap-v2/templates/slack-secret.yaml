apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: slack
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: monitoring-secretstore
  target:
    name: slack
  dataFrom:
    - extract:
        key: 9c-main-v2/slack
---
# (2026-09-29) IAP 알람 웹훅을 monitoring 으로 끌어온다 — Grafana 가 #9c-iap-alert 로
#   쏘려면 필요하다. **AWS 에 값을 복사하지 않는다.**
#
# 9c-main-v2/slack 은 ap-northeast-2 이고 IAP 웹훅은 us-east-2 의
#   9c-main-v2/external-services/iap-env 에 있다. 두 시크릿은 복제 관계가 아니라
#   독립 2벌이라, 값을 복사해 두면 한쪽만 갱신됐을 때 조용히 어긋난다. 그래서
#   리전만 다른 SecretStore 를 하나 더 두고 **원본을 그대로 참조**한다.
#   (워커·워치독·Grafana 가 같은 경로를 쓰게 되어 "이 웹훅이 살아있나"도 한 번에 검증된다.)
#
# 인증은 external-secrets 컨트롤러의 앰비언트 자격증명이다(두 스토어 다 auth 블록이 없다).
#   같은 자격증명으로 us-east-2 를 이미 읽고 있어 그대로 된다 — 실제로 임시 리소스를
#   띄워 SecretSynced/True 와 값 일치(sha256)를 확인한 뒤 이 매니페스트를 썼다.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: monitoring-secretstore-use2
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: "us-east-2"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: slack-iap
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: monitoring-secretstore-use2
  target:
    name: slack-iap
  data:
    - secretKey: slack-webhook-iap
      remoteRef:
        key: 9c-main-v2/external-services/iap-env
        property: iap-alert-webhook-url
