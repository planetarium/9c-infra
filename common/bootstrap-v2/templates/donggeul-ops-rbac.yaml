{{- if (.Values.donggeulOps).enabled }}
# 동글이 옵스(pt4 동글이 컨테이너의 ops 사용자)용 ServiceAccount.
# 알림이 오면 조사하고 서비스 재시작까지 선조치한 뒤 #donggeul-ops 에 보고한다. 운영 문서: 9c-ops common/donggeul.md
#
# - 읽기: 클러스터 전체. secret·configmap 은 없다 — 지급 서비스의 KMS 서명 자격증명이 secret 에 있다.
# - 조치: restartNamespaces 에서 파드 삭제(= 같은 설정으로 재시작)·박힌 job 삭제, scaleNamespaces 에서 scale.
# - 없음: exec·파드 생성·deployment patch(지급 서비스 파드 안에 KMS 서명 권한이 있어 설정을 바꾸면 서명을 시킬 수 있다),
#         체인 노드(odin·heimdall·thor) 쓰기, PVC·볼륨·네임스페이스 삭제.
apiVersion: v1
kind: Namespace
metadata:
  name: donggeul-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donggeul-ops
  namespace: donggeul-ops
---
# 만료 없는 SA 토큰. 회수는 이 시크릿 삭제.
apiVersion: v1
kind: Secret
metadata:
  name: donggeul-ops-token
  namespace: donggeul-ops
  annotations:
    kubernetes.io/service-account.name: donggeul-ops
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: donggeul-ops-read
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - nodes
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [volumes, replicas, engines, nodes]
    verbs: [get, list, watch]
  # 동기화 상태만 본다. 값은 secret 에 있고 secret 권한은 없다.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores, clustersecretstores]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-ops-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-ops-read
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- range .Values.donggeulOps.restartNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-restart
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-restart
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-restart
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
{{- range .Values.donggeulOps.scaleNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-scale
  namespace: {{ . }}
rules:
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-scale
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-scale
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
{{- range $ns, $names := .Values.donggeulOps.secretReads }}
---
# 이름을 지정한 secret 만 읽는다. 동글이(모델)는 값을 보지 못한다 — 읽는 건 root 래퍼(ops-db-query·ops-svc-config)이고,
# 모델은 조회 결과·허용된 설정 키만 받는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-secret-read
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range $names }}
      - {{ . }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-secret-read
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-secret-read
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
{{- with .Values.donggeulOps.rotate }}
{{- if .enabled }}
---
# 볼륨 로테이션(validator↔rpc 볼륨 스왑, 옛 볼륨 → clone) 전용 SA. donggeul-ops 와 분리해 토큰을 따로 둔다.
# 동글이 컨테이너의 root 래퍼 ops-rotate 만 이 토큰을 읽는다. 실행(execute)은 운영자의 Slack 승인 뒤에만.
# - StatefulSet scale 은 이름을 지정한 것만(resourceNames).
# - PVC 생성·삭제, 임시 파드(tip 조회·txexec 삭제) 생성·삭제는 이 네임스페이스들에서만. 무엇을 지울지는 래퍼가
#   "어떤 워크로드도 참조하지 않고 detached" 인지 확인한 뒤 고른다(Kubernetes 는 create 를 이름으로 제한하지 못한다).
# - ArgoCD 는 해당 앱의 operation(selective sync) 만, Longhorn 은 볼륨·snapshot 삭제만.
# - RBAC 로 못 좁히는 부분은 아래 ValidatingAdmissionPolicy 가 이 SA 의 요청만 골라 막는다
#   (Application spec 변경, 임의 파드, 남의 PV·Longhorn 볼륨 삭제).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donggeul-rotate
  namespace: donggeul-ops
---
apiVersion: v1
kind: Secret
metadata:
  name: donggeul-rotate-token
  namespace: donggeul-ops
  annotations:
    kubernetes.io/service-account.name: donggeul-rotate
type: kubernetes.io/service-account-token
---
# 조회는 donggeul-ops 와 같은 읽기 역할(secret·configmap 없음)을 쓴다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-rotate-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-ops-read
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: donggeul-rotate-pv
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-rotate-pv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-rotate-pv
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-rotate-longhorn
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes, snapshots]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-rotate-longhorn
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-rotate-longhorn
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-rotate-argocd
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames:
      {{- range $ns, $c := .namespaces }}
      - {{ $c.app }}
      {{- end }}
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-rotate-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-rotate-argocd
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
{{- range $ns, $c := .namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-rotate
  namespace: {{ $ns }}
rules:
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames:
      {{- range $c.statefulsets }}
      - {{ . }}
      {{- end }}
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-rotate
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-rotate
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
{{- end }}
{{- $nsList := keys .namespaces | sortAlpha }}
{{- $apps := list }}{{- $stsList := list }}
{{- range $ns, $c := .namespaces }}{{- $apps = append $apps $c.app }}{{- $stsList = concat $stsList $c.statefulsets }}{{- end }}
{{- $sa := "system:serviceaccount:donggeul-ops:donggeul-rotate" }}
---
# 이 SA 의 Application 수정은 operation(selective sync) 만 — spec 은 그대로, 대상은 지정한 StatefulSet, prune 없음.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-rotate-argocd
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [applications]
  matchConditions:
    - name: rotate-sa
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: object.spec == oldObject.spec
      message: donggeul-rotate 는 Application spec 을 바꿀 수 없습니다
    - expression: >-
        object.?status == oldObject.?status &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?labels == oldObject.metadata.?labels
      message: donggeul-rotate 는 Application status·ownerReferences·finalizers·labels 를 바꿀 수 없습니다
    - expression: "!has(oldObject.operation) || (has(object.operation) && object.operation == oldObject.operation)"
      message: donggeul-rotate 는 진행 중인(대기 중인) operation 을 바꾸거나 지울 수 없습니다
    - expression: object.metadata.?annotations == oldObject.metadata.?annotations
      message: donggeul-rotate 는 Application annotations 를 바꿀 수 없습니다
    - expression: >-
        !has(object.operation) ||
        (has(object.operation.sync) && has(object.operation.sync.resources) &&
         size(object.operation.sync.resources) > 0 &&
         object.operation.sync.resources.all(r, r.kind == 'StatefulSet' && r.name in {{ $stsList | uniq | toJson }}) &&
         (!has(object.operation.sync.prune) || object.operation.sync.prune == false) &&
         !has(object.operation.sync.manifests) && !has(object.operation.sync.source) &&
         !has(object.operation.sync.sources) && !has(object.operation.sync.syncOptions) &&
         !has(object.operation.sync.syncStrategy) && !has(object.operation.retry) &&
         !has(object.operation.sync.revisions) && has(object.operation.sync.revision) &&
         oldObject.?status.?sync.?revision.orValue('') != '' &&
         object.operation.sync.revision == oldObject.status.sync.revision)
      message: donggeul-rotate 의 sync 는 git 의 지정 StatefulSet selective sync(prune·매니페스트·소스 재지정·옵션 없음)만
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-argocd
spec:
  policyName: donggeul-rotate-argocd
  validationActions: [Deny]
---
# 임시 파드: 라벨 app=donggeul-rotate, PVC 볼륨만, SA 토큰·시크릿·호스트 접근 없음, 이미지 허용 목록. 지우는 것도 그 라벨만.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-rotate-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, DELETE]
        resources: [pods]
  matchConditions:
    - name: rotate-sa
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        request.operation == 'DELETE' ?
        (has(oldObject.metadata.labels) && oldObject.metadata.labels[?'app'].orValue('') == 'donggeul-rotate') :
        (has(object.metadata.labels) && object.metadata.labels[?'app'].orValue('') == 'donggeul-rotate')
      message: donggeul-rotate 는 app=donggeul-rotate 파드만 만들고 지울 수 있습니다
    - expression: >-
        request.operation == 'DELETE' || (
        object.spec.automountServiceAccountToken == false &&
        !object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false) &&
        !has(object.spec.initContainers) && !has(object.spec.ephemeralContainers) &&
        object.spec.volumes.all(v, has(v.persistentVolumeClaim)) &&
        object.spec.containers.all(c,
          (c.image == 'alpine:3.20' || c.image.startsWith('planetariumhq/ninechronicles-headless:')) &&
          !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))) &&
          !c.?securityContext.?privileged.orValue(false) &&
          size(c.?securityContext.?capabilities.?add.orValue([])) == 0))
      message: donggeul-rotate 임시 파드 제약(PVC 볼륨만·토큰 없음·시크릿 env 없음·허용 이미지) 위반
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-pods
spec:
  policyName: donggeul-rotate-pods
  validationActions: [Deny]
---
# PV 는 대상 네임스페이스 PVC 가 쓰던 Released 볼륨만, Longhorn 볼륨은 그 네임스페이스의 detached 볼륨만 지운다.
# (타입별로 정책을 나눈다 — 한 식에 섞으면 PV 타입 검사에서 Longhorn 필드가 컴파일 오류가 된다)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-rotate-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [persistentvolumes]
  matchConditions:
    - name: rotate-sa
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        oldObject.spec.?claimRef.?namespace.orValue('') in {{ $nsList | toJson }} &&
        oldObject.status.?phase.orValue('') == 'Released'
      message: donggeul-rotate 는 대상 네임스페이스의 Released PV 만 지울 수 있습니다
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-volumes
spec:
  policyName: donggeul-rotate-volumes
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-rotate-longhorn-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [longhorn.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [volumes]
  matchConditions:
    - name: rotate-sa
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        oldObject.status.?kubernetesStatus.?namespace.orValue('') in {{ $nsList | toJson }} &&
        oldObject.status.?state.orValue('') == 'detached'
      message: donggeul-rotate 는 대상 네임스페이스의 detached Longhorn 볼륨만 지울 수 있습니다
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-longhorn-volumes
spec:
  policyName: donggeul-rotate-longhorn-volumes
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- with .Values.donggeulOps.sync }}
{{- if .enabled }}
---
# ArgoCD 리소스 지정 동기화 전용 SA(donggeul-sync).
# - Application 은 apps 에 적은 이름만 get·patch.
# - 아래 ValidatingAdmissionPolicy 가 이 SA 의 요청을 막는다: spec·status·소유·finalizer·label 변경 불가, annotations 는
#   새로고침 요청만, 기존 operation 변경 불가, sync 는 리소스를 지정한 것만(prune·매니페스트·소스 재지정·옵션·재시도 없음),
#   리비전은 ArgoCD 가 이미 비교한 리비전(status.sync.revision)만 — status 를 못 바꾸니 머지 안 된 커밋으로 동기화하지 못한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donggeul-sync
  namespace: donggeul-ops
---
apiVersion: v1
kind: Secret
metadata:
  name: donggeul-sync-token
  namespace: donggeul-ops
  annotations:
    kubernetes.io/service-account.name: donggeul-sync
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-sync-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-ops-read
subjects:
  - kind: ServiceAccount
    name: donggeul-sync
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-sync-argocd
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames:
      {{- range .apps }}
      - {{ . }}
      {{- end }}
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-sync-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-sync-argocd
subjects:
  - kind: ServiceAccount
    name: donggeul-sync
    namespace: donggeul-ops
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-sync-argocd
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [applications]
  matchConditions:
    - name: sync-sa
      expression: request.userInfo.username == "system:serviceaccount:donggeul-ops:donggeul-sync"
  variables:
    - name: newAnn
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnn
      expression: "oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: object.spec == oldObject.spec
      message: donggeul-sync 는 Application spec 을 바꿀 수 없습니다
    - expression: >-
        object.?status == oldObject.?status &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?labels == oldObject.metadata.?labels
      message: donggeul-sync 는 Application status·ownerReferences·finalizers·labels 를 바꿀 수 없습니다
    - expression: "!has(oldObject.operation) || (has(object.operation) && object.operation == oldObject.operation)"
      message: donggeul-sync 는 진행 중인(대기 중인) operation 을 바꾸거나 지울 수 없습니다
    # annotations 는 새로고침 요청(argocd.argoproj.io/refresh: normal|hard) 하나만 더하거나 바꿀 수 있다
    - expression: >-
        variables.newAnn.all(k, k == 'argocd.argoproj.io/refresh' ?
          (variables.newAnn[k] in ['normal', 'hard']) :
          (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == 'argocd.argoproj.io/refresh' || k in variables.newAnn)
      message: donggeul-sync 는 새로고침 주석 말고 annotations 를 바꿀 수 없습니다
    - expression: >-
        !has(object.operation) || (
        has(object.operation.sync) && has(object.operation.sync.resources) &&
        size(object.operation.sync.resources) > 0 && size(object.operation.sync.resources) <= 50 &&
        (!has(object.operation.sync.prune) || object.operation.sync.prune == false) &&
        !has(object.operation.sync.manifests) && !has(object.operation.sync.source) &&
        !has(object.operation.sync.sources) && !has(object.operation.sync.revisions) &&
        !has(object.operation.sync.syncOptions) && !has(object.operation.sync.syncStrategy) &&
        !has(object.operation.retry) &&
        has(object.operation.sync.revision) &&
        oldObject.?status.?sync.?revision.orValue('') != '' &&
        object.operation.sync.revision == oldObject.status.sync.revision)
      message: donggeul-sync 의 sync 는 ArgoCD 가 비교한 리비전으로 지정 리소스만(prune·매니페스트·소스 재지정·옵션·재시도 없음)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-sync-argocd
spec:
  policyName: donggeul-sync-argocd
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- end }}
