{{- if (.Values.donggeulOps).enabled }}
# 동글이 옵스(pt4 동글이 컨테이너의 ops 사용자)용 ServiceAccount.
# 알림이 오면 조사하고 서비스 재시작까지 선조치한 뒤 #donggeul-ops 에 보고한다. 운영 문서: 9c-ops common/donggeul.md
#
# - 읽기: 클러스터 전체 조회(get·list·watch). 빼는 것은 secret(지급 서비스의 KMS 서명 자격증명이 있다),
#         proxy·exec·attach·portforward 하위 리소스(GET 으로 kubelet·파드에 들어가는 우회로), Rancher(*.cattle.io — 토큰·
#         클라우드 자격증명·Helm 값), external-secrets 생성기, metallb bgppeers(비밀번호 필드).
#         configmap 은 연다(2026-11-03 두 클러스터 전수 확인 — 비밀값 없음. 비밀값은 ExternalSecret → secret 이 관례).
# - 조치: restartNamespaces 에서 파드 삭제(= 같은 설정으로 재시작)·박힌 job 삭제, scaleNamespaces 에서 scale.
# - 없음: exec·파드 생성·deployment patch(지급 서비스 파드 안에 KMS 서명 권한이 있어 설정을 바꾸면 서명을 시킬 수 있다),
#         체인 노드(odin·heimdall·thor) 쓰기, PVC·볼륨·네임스페이스 삭제.
apiVersion: v1
kind: Namespace
metadata:
  name: donggeul-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donggeul-ops
  namespace: donggeul-ops
---
# 만료 없는 SA 토큰. 회수는 이 시크릿 삭제.
apiVersion: v1
kind: Secret
metadata:
  name: donggeul-ops-token
  namespace: donggeul-ops
  annotations:
    kubernetes.io/service-account.name: donggeul-ops
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: donggeul-ops-read
rules:
  # pt6 는 같은 규칙을 charts/donggeul-ops-read 에 따로 둔다 — 여기를 바꾸면 거기도 바꾼다.
  # 기본 그룹: secret 과 proxy·exec·attach·portforward·eviction 을 뺀 목록. RBAC 에는 "제외"가 없어 하나씩 적는다.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - events
      - services
      - services/status
      - endpoints
      - nodes
      - nodes/status
      - namespaces
      - namespaces/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - resourcequotas
      - resourcequotas/status
      - limitranges
      - configmaps
      - serviceaccounts
      - replicationcontrollers
      - replicationcontrollers/status
      - podtemplates
      - componentstatuses
    verbs: [get, list, watch]
  # 나머지 그룹은 전체 조회(Rancher *.cattle.io·generators.external-secrets.io·hub.traefik.io 는 넣지 않는다).
  # 와일드카드라 이미 연 그룹에 새 종류가 생기면 같이 열린다 — 새 CRD 그룹을 더하거나 기존 그룹에 컨트롤러를 더 설치할 때
  # (예: argoproj.io 에 Argo Workflows·Events) 평문 자격증명 필드가 있는지 보고 이 목록을 다시 정한다.
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - argoproj.io
      - autoscaling
      - batch
      - cert-manager.io
      - certificates.k8s.io
      - cluster.x-k8s.io
      - coordination.k8s.io
      - crd.projectcalico.org
      - discovery.k8s.io
      - events.k8s.io
      - external-secrets.io
      - externaldns.k8s.io
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - groupsnapshot.storage.k8s.io
      - longhorn.io
      - metrics.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - policy.networking.k8s.io
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - storage.k8s.io
      - tailscale.com
      - traefik.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metallb.io]
    resources: [bfdprofiles, bgpadvertisements, communities, ipaddresspools, l2advertisements, servicel2statuses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-ops-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-ops-read
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- range .Values.donggeulOps.restartNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-restart
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-restart
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-restart
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
{{- range .Values.donggeulOps.scaleNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-scale
  namespace: {{ . }}
rules:
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-scale
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-scale
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
{{- range $ns, $names := .Values.donggeulOps.secretReads }}
---
# 이름을 지정한 secret 만 읽는다. 동글이(모델)는 값을 보지 못한다 — 읽는 건 root 래퍼(ops-db-query·ops-svc-config)이고,
# 모델은 조회 결과·허용된 설정 키만 받는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-secret-read
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range $names }}
      - {{ . }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-secret-read
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-secret-read
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
{{- with .Values.donggeulOps.logfile }}
{{- if .namespaces }}
{{- range .namespaces }}
---
# 스냅샷 잡 파드 안 headless 로그 파일 읽기(ops-kubectl logfile). preload_headless.sh 는 원인 로그를 PVC·hostPath 파일에만 쓴다.
# RBAC 로는 exec 명령을 고를 수 없어 아래 VAP donggeul-ops-logfile-exec 가 명령 모양을 고정한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-logfile
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-logfile
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-logfile
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
{{- end }}
---
# 같은 정책이 pt6 에도 있다(charts/donggeul-ops-read/templates/logfile-exec.yaml). 두 곳을 같게 유지한다.
#   timeout 60 + (ls -la -- <로그 폴더> / tail -n <1~2000> -- <로그 파일> / zgrep -E -n -m <1~2000> -e <패턴> -- <로그 파일>)
#   로그 폴더 = /data|/output 아래 snapshot_logs·preload_logs, 파일은 그 바로 아래 이름만. stdin·tty 불가. 파드는 snapshot-* 만
#   (heimdall 네임스페이스엔 validator·rpc 가 있다 — 그 안에서는 어떤 명령도 안 됨).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-ops-logfile-exec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Role 보다 먼저 적용(같은 단계면 ArgoCD 가 VAP 를 마지막에 적용)
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec"]
  matchConditions:
    - name: donggeul-ops-sa
      expression: "request.userInfo.username == 'system:serviceaccount:donggeul-ops:donggeul-ops'"
  variables:
    - name: c
      expression: "has(object.command) ? object.command : []"
    - name: dirRe
      expression: "'^/(data|output)/(snapshot_logs|preload_logs)/?$'"
    - name: fileRe
      expression: "'^/(data|output)/(snapshot_logs|preload_logs)/[A-Za-z0-9._-]+$'"
    - name: numRe
      expression: "'^([1-9][0-9]{0,2}|1[0-9]{3}|2000)$'"
  validations:
    - expression: "!(has(object.stdin) && object.stdin) && !(has(object.tty) && object.tty)"
      message: "donggeul-ops logfile: stdin·tty 는 쓸 수 없습니다"
    - expression: "request.name.startsWith('snapshot-')"
      message: "donggeul-ops logfile: 스냅샷 잡 파드(snapshot-*)만 — 체인 노드 파드 안에서는 실행하지 않는다"
    - expression: >-
        size(variables.c) >= 2 && variables.c[0] == 'timeout' && variables.c[1] == '60'
        && ((size(variables.c) == 6 && variables.c[2] == 'ls' && variables.c[3] == '-la' && variables.c[4] == '--'
              && variables.c[5].matches(variables.dirRe))
          || (size(variables.c) == 7 && variables.c[2] == 'tail' && variables.c[3] == '-n'
              && variables.c[4].matches(variables.numRe) && variables.c[5] == '--'
              && variables.c[6].matches(variables.fileRe) && !variables.c[6].contains('..'))
          || (size(variables.c) == 11 && variables.c[2] == 'zgrep' && variables.c[3] == '-E' && variables.c[4] == '-n'
              && variables.c[5] == '-m' && variables.c[6].matches(variables.numRe) && variables.c[7] == '-e'
              && size(variables.c[8]) > 0 && size(variables.c[8]) <= 200 && variables.c[9] == '--'
              && variables.c[10].matches(variables.fileRe) && !variables.c[10].contains('..')))
      message: "donggeul-ops logfile: 허용된 명령 모양(timeout 60 + ls·tail·zgrep, 로그 폴더 안)이 아닙니다"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-ops-logfile-exec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Role 보다 먼저 적용(같은 단계면 ArgoCD 가 VAP 를 마지막에 적용)
spec:
  policyName: donggeul-ops-logfile-exec
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- with .Values.donggeulOps.loki }}
{{- if .enabled }}
---
# Loki 조회(ops-kubectl loki). API 서버의 서비스 프록시로 클러스터 안 Loki 에 GET 만 한다(get = HTTP GET, POST 는 create 라 막힘).
# 서비스 이름은 `<이름>:<포트>` 를 정확히 적어야 맞는다. Loki 에는 GET 으로 상태를 바꾸는 경로(/ingester/shutdown 등)와
# 설정을 보여 주는 경로(/config)가 있어, 아래 VAP 가 조회 API 경로만 허용한다(경로의 `..`·%2F 인코딩도 거부됨, 1.31 실측).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-ops-loki
  namespace: {{ .namespace }}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: [{{ .service | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-ops-loki
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-ops-loki
subjects:
  - kind: ServiceAccount
    name: donggeul-ops
    namespace: donggeul-ops
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-ops-loki-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Role 보다 먼저 적용(같은 단계면 ArgoCD 가 VAP 를 마지막에 적용)
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["services/proxy"]
  matchConditions:
    - name: donggeul-ops-sa
      expression: "request.userInfo.username == 'system:serviceaccount:donggeul-ops:donggeul-ops'"
  validations:
    - expression: "has(object.path) && object.path.matches('^/loki/api/v1/(query_range|labels|label/[A-Za-z0-9_]+/values)$')"
      message: "donggeul-ops loki: 조회 API 경로만 쓸 수 있습니다"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-ops-loki-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Role 보다 먼저 적용(같은 단계면 ArgoCD 가 VAP 를 마지막에 적용)
spec:
  policyName: donggeul-ops-loki-proxy
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- with .Values.donggeulOps.rbGateway }}
{{- if .enabled }}
---
# 동글이 옵스 rb 조회용 SA. v8-gateway 서비스(포트 이름 http) 프록시 POST 만. 사용 범위는 9c-ops ops-rb 참고.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donggeul-rb
  namespace: donggeul-ops
---
apiVersion: v1
kind: Secret
metadata:
  name: donggeul-rb-token
  namespace: donggeul-ops
  annotations:
    kubernetes.io/service-account.name: donggeul-rb
type: kubernetes.io/service-account-token
{{- range .namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-rb-gateway
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["v8-gateway:http"]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-rb-gateway
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-rb-gateway
subjects:
  - kind: ServiceAccount
    name: donggeul-rb
    namespace: donggeul-ops
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.donggeulOps.rotate }}
{{- if .enabled }}
---
# 볼륨 로테이션(validator↔rpc 볼륨 스왑, 옛 볼륨 → clone) 전용 SA. donggeul-ops 와 분리해 토큰을 따로 둔다.
# 동글이 컨테이너의 root 래퍼 ops-rotate 만 이 토큰을 읽는다. swap·clone 실행은 운영자의 Slack 승인 뒤에만,
# rpc 스냅샷 리셋(reset-rpc)은 실행기가 전제 확인 뒤 바로(오류일 때만 사람).
# - StatefulSet scale 은 이름을 지정한 것만(resourceNames).
# - PVC 생성·삭제, 임시 파드(tip 조회·txexec 삭제)·리셋 파드 생성·삭제는 이 네임스페이스들에서만. 파드 조회·로그·
#   스크립트 ConfigMap 조회는 donggeul-ops-read(아래 ClusterRoleBinding)로 이미 된다. 무엇을 지울지는 래퍼가
#   "어떤 워크로드도 참조하지 않고 detached" 인지 확인한 뒤 고른다(Kubernetes 는 create 를 이름으로 제한하지 못한다).
# - ArgoCD 는 해당 앱의 operation(selective sync) 만, Longhorn 은 볼륨·snapshot 삭제와 노드 patch(디스크 스케줄링 on/off)만.
# - clone 동안 원본 볼륨 보호: 원본 PVC 의 정기 트림 라벨(recurring-job.longhorn.io/<trimJobs>)을 잠시 떼고, 원본 복제본이 있는
#   디스크를 allowScheduling=false 로 막아 clone 대상이 다른 디스크에 놓이게 한다. 끝나면 래퍼가 둘 다 원래대로 되돌린다.
#   복제본·정기 작업·노드 조회는 donggeul-ops-read(longhorn.io 전체 조회)로 이미 된다.
# - RBAC 로 못 좁히는 부분은 아래 ValidatingAdmissionPolicy 가 이 SA 의 요청만 골라 막는다
#   (Application spec 변경, 임의 파드, 남의 PV·Longhorn 볼륨 삭제, PVC 의 트림 라벨 밖 변경, Longhorn 노드의 디스크
#   allowScheduling 밖 변경).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donggeul-rotate
  namespace: donggeul-ops
---
apiVersion: v1
kind: Secret
metadata:
  name: donggeul-rotate-token
  namespace: donggeul-ops
  annotations:
    kubernetes.io/service-account.name: donggeul-rotate
type: kubernetes.io/service-account-token
---
# 조회는 donggeul-ops 와 같은 읽기 역할(secret 없음)을 쓴다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-rotate-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-ops-read
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: donggeul-rotate-pv
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: donggeul-rotate-pv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: donggeul-rotate-pv
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-rotate-longhorn
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes, snapshots]
    verbs: [get, list, delete]
  # 디스크 allowScheduling 만 바꾼다(아래 donggeul-rotate-longhorn-nodes VAP). 조회는 donggeul-ops-read.
  - apiGroups: [longhorn.io]
    resources: [nodes]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: donggeul-rotate-longhorn
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: donggeul-rotate-longhorn
subjects:
  - kind: ServiceAccount
    name: donggeul-rotate
    namespace: donggeul-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: donggeul-rotate-argocd
  namespace: argocd
rules:
