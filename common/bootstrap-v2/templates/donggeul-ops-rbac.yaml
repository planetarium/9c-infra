apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-longhorn-volumes
spec:
  policyName: donggeul-rotate-longhorn-volumes
  validationActions: [Deny]
---
# PVC 수정은 values 의 trimJobs 에 적은 트림 작업 라벨(recurring-job.longhorn.io/<이름>)을 붙이고(값 enabled)·떼는 것만.
# 다른 정기 작업(스냅샷 삭제·백업 등)은 validator 볼륨에 붙일 수 없게 이름 목록으로 고정한다. spec·annotations·
# finalizers·ownerReferences 와 다른 라벨, recurring-job.longhorn.io/source(볼륨 라벨의 원본 표시)는 그대로.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-rotate-pvc-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [persistentvolumeclaims]
  matchConditions:
    - name: rotate-sa
      expression: request.userInfo.username == {{ $sa | quote }}
  variables:
    - name: newL
      expression: "object.metadata.?labels.orValue({})"
    - name: oldL
      expression: "oldObject.metadata.?labels.orValue({})"
    - name: trimKeys
      expression: {{ $trimKeys | toJson | quote }}
  validations:
    - expression: object.spec == oldObject.spec
      message: donggeul-rotate 는 PVC spec 을 바꿀 수 없습니다
    - expression: >-
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: donggeul-rotate 는 PVC annotations·finalizers·ownerReferences 를 바꿀 수 없습니다
    - expression: >-
        variables.newL.all(k,
          (k in variables.oldL && variables.oldL[k] == variables.newL[k]) ||
          (k in variables.trimKeys && variables.newL[k] == 'enabled')) &&
        variables.oldL.all(k, k in variables.newL || k in variables.trimKeys)
      message: donggeul-rotate 는 PVC 의 정기 트림 작업 라벨({{ join ", " $trimKeys }})만 붙이고(값 enabled) 뗄 수 있습니다
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-pvc-labels
spec:
  policyName: donggeul-rotate-pvc-labels
  validationActions: [Deny]
---
# Longhorn 노드 수정은 이미 있는 디스크의 allowScheduling 만. 노드 수준 필드(allowScheduling·evictionRequested·tags 등),
# 디스크의 나머지 필드, 디스크 추가·삭제, labels·annotations·finalizers·ownerReferences 는 그대로.
# spec 필드는 Longhorn v1.9.1 CRD(v1beta2) 기준으로 하나씩 적는다(구조 스키마라 객체 필드를 순회할 수 없다) —
# Longhorn 을 올려 node·disk spec 에 필드가 생기면 여기에 더한다.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: donggeul-rotate-longhorn-nodes
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: longhorn-system
    resourceRules:
      # 제공 버전을 적어 형식 검사가 CRD 스키마로 돈다(다른 버전 요청도 matchPolicy Equivalent 로 이 정책에 걸린다).
      - apiGroups: [longhorn.io]
        apiVersions: [v1beta2]
        operations: [UPDATE]
        resources: [nodes]
  matchConditions:
    - name: rotate-sa
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        object.spec.?allowScheduling == oldObject.spec.?allowScheduling &&
        object.spec.?evictionRequested == oldObject.spec.?evictionRequested &&
        object.spec.?tags == oldObject.spec.?tags &&
        object.spec.?name == oldObject.spec.?name &&
        object.spec.?instanceManagerCPURequest == oldObject.spec.?instanceManagerCPURequest
      message: donggeul-rotate 는 Longhorn 노드 수준 spec 을 바꿀 수 없습니다
    - expression: >-
        has(object.spec.disks) == has(oldObject.spec.disks) &&
        (!has(object.spec.disks) || (
          size(object.spec.disks) == size(oldObject.spec.disks) &&
          oldObject.spec.disks.all(k, k in object.spec.disks)))
      message: donggeul-rotate 는 Longhorn 디스크를 더하거나 뺄 수 없습니다
    - expression: >-
        !has(object.spec.disks) ||
        object.spec.disks.all(k, k in oldObject.spec.disks &&
          object.spec.disks[k].?path == oldObject.spec.disks[k].?path &&
          object.spec.disks[k].?tags == oldObject.spec.disks[k].?tags &&
          object.spec.disks[k].?storageReserved == oldObject.spec.disks[k].?storageReserved &&
          object.spec.disks[k].?evictionRequested == oldObject.spec.disks[k].?evictionRequested &&
          object.spec.disks[k].?diskType == oldObject.spec.disks[k].?diskType &&
          object.spec.disks[k].?diskDriver == oldObject.spec.disks[k].?diskDriver)
      message: donggeul-rotate 는 Longhorn 디스크의 allowScheduling 말고는 바꿀 수 없습니다
    - expression: >-
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: donggeul-rotate 는 Longhorn 노드 labels·annotations·finalizers·ownerReferences 를 바꿀 수 없습니다
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: donggeul-rotate-longhorn-nodes
spec:
  policyName: donggeul-rotate-longhorn-nodes
  validationActions: [Deny]
{{- end }}
